<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobVue</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#ff4a1f;--nv:#141b4d;--ye:#f6c95a;--mi:#74f08e;--bl:#6fa8ff;--pk:#ffb3b3;--li:#e4f25a;--pu:#7b4cf0}
*{box-sizing:border-box}body{margin:0;background:var(--nv);color:#fff;font:16px/1.5 Sora,system-ui,sans-serif}
.wrap{max-width:900px;margin:16px auto;border-radius:34px;padding:22px 22px 100px;min-height:92vh;background:radial-gradient(circle at 50% 35%,var(--or) 0 52%,#c2301f 72%,#3b1d6e 100%)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.logo{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9a7ff 60%,#6a4fd1)}
.pill{border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;background:#fff;color:var(--nv)}.pill.dk{background:var(--nv);color:#fff}.pill:disabled{opacity:.5}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:.2em 0 .3em;font-weight:800;letter-spacing:-.02em}h2{margin:0 0 .3em}
.card{border-radius:28px;padding:20px;color:var(--nv);margin:12px 0}
.ye{background:var(--ye)}.mi{background:var(--mi)}.bl{background:var(--bl)}.pk{background:var(--pk)}.li{background:var(--li)}.nv{background:var(--nv);color:#fff}.wh{background:#fff}.pu{background:var(--pu);color:#fff}.rd{background:#e8412c;color:#fff}
.arrow{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--nv);display:grid;place-items:center;font-weight:800;border:0;cursor:pointer;flex:none}
.chip{display:inline-block;background:rgba(255,255,255,.8);color:var(--nv);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.big{font-size:2.6rem;font-weight:800;line-height:1}
.opt{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:13px 16px;margin:8px 0;font:inherit;background:#fff;color:var(--nv);cursor:pointer}
.opt.g{background:var(--mi)}.opt.m{background:var(--ye)}.opt.b{background:var(--pk)}.why{display:block;font-size:.85rem;opacity:.85}
video{width:100%;border-radius:22px;background:#000;max-height:320px}#cam{transform:scaleX(-1)}
#pip{position:fixed;right:18px;bottom:86px;width:120px;border-radius:18px;border:3px solid #fff;z-index:5;transform:scaleX(-1)}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.4);overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--nv)}
nav.bot{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#fff;border-radius:999px;padding:8px;display:flex;gap:6px;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.3)}
nav.bot button{border:0;border-radius:999px;padding:10px 22px;font:inherit;font-weight:600;background:none;color:var(--nv);cursor:pointer}nav.bot button.on{background:var(--nv);color:#fff}
textarea{width:100%;min-height:100px;border-radius:18px;border:0;padding:12px;font:inherit;margin-top:10px}
.meter{height:10px;background:rgba(20,27,77,.2);border-radius:6px;margin-top:10px}.meter i{display:block;height:100%;width:0;background:var(--nv);border-radius:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.grid2 .card{margin:0}
.dot{position:absolute;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer}.field{position:relative;height:300px;background:#fff;border-radius:22px;overflow:hidden}
.meta{font-size:.85rem;opacity:.9}ul{margin:.4em 0;padding-left:1.2em}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="logo"></div><b style="font-size:1.3rem">JobVue</b><span style="flex:1"></span><span class="chip">Camera + mic required</span></div><main id="app"></main></div>
<nav class="bot"><button data-v="home" class="on">Home</button><button data-v="dash">Dashboard</button></nav>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let D={ans:[],vjt:[],games:[]};try{D=Object.assign(D,JSON.parse(localStorage.getItem('jobvue')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('jobvue',JSON.stringify(D))}catch(e){}};
const shf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const mmss=s=>Math.floor(Math.max(s,0)/60)+':'+String(Math.max(s,0)%60).padStart(2,'0');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
let tm=null,alive=0,stream=null,co='shell';
const stop=()=>{clearInterval(tm);tm=null};
function tick(sec,cb,upd){stop();let l=sec;upd(l);tm=setInterval(()=>{l--;upd(l);if(l<=0){stop();cb()}},1000)}
const upd=l=>{const e=$('#tm');if(e)e.textContent=mmss(l)};

/* ---- Company content (value names verified from each company's careers pages) ---- */
const CO={
shell:{name:'Shell',role:'Graduate · Information & Digital Technology',col:'ye',retake:false,
 vals:[['Honesty',"Shell's published core value. Show openness, including about mistakes."],['Integrity',"Shell's published core value. Show doing the right thing under pressure."],['Respect',"Shell's published core value. Show valuing different people and views."]],
 kw:{Honesty:/honest|truth|transparent|admitted|open about|upfront|owned up/i,Integrity:/integrity|right thing|ethic|policy|compliance|safe|report(ed)?|refus|speak(ing)? up|stopp/i,Respect:/respect|listen|inclusi|perspective|different (view|opinion)|support(ed)?|colleague/i},
 stages:[['vjt','Virtual Job Try-out','Workplace scenarios'],['odvi','On-demand video interview','30s prep, 2 min answers, camera and mic']],
 Q:[['Why Shell, and why a graduate role in Information & Digital Technology?','Motivation'],['Tell us about a time you used data or technology to solve a real problem.','Problem-solving'],['Describe a time you worked in a team with people who saw things differently.','Teamwork'],['Tell us about a time you did the right thing when it was inconvenient.','Integrity'],['Describe a mistake you made and how you handled it.','Honesty'],['How can technology support the energy transition?','Industry awareness']]},
bae:{name:'BAE Systems',role:'Graduate Data Analyst',col:'bl',retake:true,
 vals:[['Trusted',"BAE's published behaviours: being committed, doing what we say we will, doing the right thing."],['Innovative',"BAE's published behaviours: being curious, learning from successes and failures, turning ideas into actions."],['Bold',"BAE's published behaviours: being courageous (speaking up, stepping forward), seizing opportunities."]],
 kw:{Trusted:/commit|deliver|promis|on time|reliab|right thing|trust|accountab|ownership|confiden/i,Innovative:/curious|new way|idea|improv|learn|automat|innovat|experiment|prototype/i,Bold:/spoke up|speak up|courag|challeng|stepped forward|initiative|volunteer|took the lead|ambiti/i},
 stages:[['odvi','HireVue video interview','Re-record allowed, camera and mic'],['games','Game-based assessments','Generic examples of the usual types']],
 Q:[['Why BAE Systems, and why a data analyst role in this industry?','Motivation'],['Tell us about a time you used data to find an insight that changed a decision.','Data insight'],['Explain a technical idea you know well to someone with no technical background.','Communication'],['Describe a time you worked to a tight deadline. How did you prioritise?','Delivery'],['Tell us about a time you found an error in your own or someone else\'s work.','Integrity'],['Describe a time you spoke up or stepped forward when it was hard.','Courage'],['Tell us about a time you handled sensitive information carefully.','Trust']]}};
const FL={num:['No measurable detail','Add one number per story: time saved, people, percentage, volume.'],res:['No clear result','End every story with what changed and what you learned.'],own:['Unclear personal contribution',"Use 'I' for your own actions and 'we' for the team's."],ref:['No reflection','Add one line: what you would do differently.'],fill:['Filler words',"Pause silently instead of saying 'um' or 'like'."],hed:['Hedging language',"Replace 'I think maybe' with direct statements."],pace:['Pace off target','Aim for 120 to 160 words a minute.'],short:['Short answers','Aim for 90 to 120 seconds.'],val:['Company values not shown','Pick one story per value and show the behaviour, not the slogan.']};

/* ---- Analysis (rule-based) ---- */
const FILL=/\b(um+|uh+|erm|like|you know|basically|actually|kind of|sort of|i mean)\b/gi,HEDGE=/\b(maybe|i think|i guess|probably|perhaps|i suppose|not sure|hopefully|sort of|kind of)\b/gi;
function an(t,secs,spoken,k){const m=r=>(t.match(r)||[]).length,w=t.trim().split(/\s+/).filter(Boolean).length,rate=n=>n/Math.max(w,1)*100,wpm=secs>0?Math.round(w/secs*60):0,cl=x=>Math.max(0,Math.min(100,Math.round(x)));
 const d={w,wpm,fill:m(FILL),hed:m(HEDGE),num:m(/\b\d[\d,.%]*\b/g),own:m(/\bI (led|built|decided|created|proposed|raised|checked|fixed|analy[sz]ed|organi[sz]ed|wrote|asked|took|designed|tested|stopped|spoke|queried|cleaned)\b/gi),caps:m(/(?<=[a-z,] )[A-Z][a-zA-Z]{2,}/g),ref:/\b(learn(ed|t)|mistake|differently|next time|feedback|challeng)/i.test(t),res:/\b(result|outcome|impact|achieved|reduced|increased|improved|saved|delivered)\b/i.test(t)};
 const vals={};let ns=0;for(const[n,r]of Object.entries(CO[k].kw)){vals[n]=r.test(t);if(vals[n])ns++}
 const empty=w<15,fl=[],off=spoken&&(wpm>175||wpm<100);
 if(!empty){if(!d.num)fl.push('num');if(!d.res)fl.push('res');if(!d.own)fl.push('own');if(!d.ref)fl.push('ref');if(rate(d.fill)>2)fl.push('fill');if(rate(d.hed)>1.5)fl.push('hed');if(off)fl.push('pace');if(w<60)fl.push('short');if(!ns)fl.push('val')}
 const parts=[spoken?(wpm>=120&&wpm<=160?20:off?5:12):14,rate(d.fill)<=2?10:rate(d.fill)<=4?7:rate(d.fill)<=7?3:0,d.res?20:0,d.own?15:0,d.num>=2?10:d.num?6:0,secs>=75&&secs<=120?15:secs>=45?10:4,Math.min(10,ns*5)];
 return{empty,flags:fl,vals,d,overall:empty?0:parts.reduce((a,b)=>a+b,0),
  spec:empty?0:cl(35+Math.min(d.num,3)*8+Math.min(d.caps,4)*5+(d.own?12:0)+(d.ref?10:0)+(d.res?5:0)+(w>=100?5:0)),
  conf:empty?0:cl(75-(rate(d.fill)>4?15:rate(d.fill)>2?7:0)-(rate(d.hed)>3?15:rate(d.hed)>1.5?7:0)-(off?10:0)-(w<60?12:0)+(d.own?8:0))}}
function fb(a,k){const c=CO[k];if(a.empty)return'<div class="card pk">Not enough content to score. Say or type at least a few sentences.</div>';
 const wk=[a.d.num&&'concrete figures',a.d.own&&'your own actions',a.d.res&&'a stated outcome',a.d.ref&&'a lesson'].filter(Boolean);
 return`<div class="grid2"><div class="card ye"><div class="big">${a.overall}</div>Overall /100</div><div class="card mi"><div class="big">${a.spec}</div>Specificity</div><div class="card bl"><div class="big">${a.conf}</div>Delivery confidence</div></div>
 <div class="card nv"><b>${c.name} values check</b>${c.vals.map(v=>`<div style="margin-top:8px"><span class="chip" style="background:var(${a.vals[v[0]]?'--mi':'--pk'})">${a.vals[v[0]]?'Shown':'Not shown'}</span> <b>${v[0]}</b><div class="meta">${v[1]}</div></div>`).join('')}</div>
 <div class="card li"><b>Fix next</b><ul>${a.flags.slice(0,3).map(f=>`<li>${FL[f][1]}</li>`).join('')||'<li>Strong on the measurable points. Keep it up.</li>'}</ul>${wk.length?`<b>What worked:</b> ${wk.join(', ')}`:''}</div>
 <p class="meta">Specificity shows how concrete your content is. It is not a lie detector. Confidence uses pace, fillers, hedging and length, never your face or tone. This is a rule-based practice score, not an employer score.</p>`}

/* ---- Camera and mic gate ---- */
function pip(on){let p=$('#pip');if(!on){if(p)p.remove();return}if(!p){p=document.createElement('video');p.id='pip';p.autoplay=p.muted=p.playsInline=true;document.body.appendChild(p)}p.srcObject=stream}
function meter(){try{const ac=new(window.AudioContext||window.webkitAudioContext)(),an2=ac.createAnalyser(),b=new Uint8Array(128);an2.fftSize=256;ac.createMediaStreamSource(stream).connect(an2);(function f(){if(!stream||!$('#lv')){ac.close();return}an2.getByteFrequencyData(b);$('#lv').style.width=Math.min(100,avg([...b])*2.2)+'%';requestAnimationFrame(f)})()}catch(e){}}
const camOk=()=>stream&&stream.active&&stream.getVideoTracks().length&&stream.getAudioTracks().length;
const needCam=cb=>camOk()?cb():gate(cb);
function gate(cb,msg){alive++;stop();pip(false);app.innerHTML=`<h1>Check your camera and mic</h1><div class="card wh"><video id="cam" autoplay muted playsinline></video><div class="meter"><i id="lv"></i></div><p id="gs">${msg||'Allow camera and microphone when asked. Both are required, as in the real assessment.'}</p><div class="row"><button class="pill dk" id="gb">Allow camera and mic</button><button class="pill" id="gc" disabled style="border:2px solid var(--nv)">Continue</button></div></div>`;
 $('#gb').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('#cam').srcObject=stream;meter();$('#gs').textContent='Camera and microphone are on. Speak and the bar should move.';$('#gc').disabled=false;stream.getTracks().forEach(t=>t.onended=()=>{stream=null;gate(()=>show('co'),'Camera or microphone disconnected, so your session was paused. Reconnect to continue.')})}catch(e){$('#gs').textContent='Permission denied or no device found. Allow access in your browser settings and try again.'}};
 $('#gc').onclick=cb}

/* ---- Screens ---- */
function home(){app.innerHTML=`<div class="meta">Hi there, nice to see you!</div><h1>Pick your interview</h1><p>Camera and microphone are required, like the real assessments.</p>`+Object.keys(CO).map(k=>`<div class="card ${CO[k].col}" data-c="${k}" style="cursor:pointer"><div class="row sp"><div><span class="chip">${CO[k].stages.length} stages</span><div class="big" style="font-size:2rem;margin-top:8px">${CO[k].name}</div><div>${CO[k].role}</div></div><button class="arrow" aria-label="Open ${CO[k].name}">↗</button></div></div>`).join('');
 document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{co=e.dataset.c;show('co')})}
function coPage(){const c=CO[co],cl=['pu','rd'];app.innerHTML=`<button class="pill" id="bk">← Back</button><h1>${c.name}</h1><div>${c.role}</div>`+c.stages.map((s,i)=>`<div class="card ${cl[i]}" data-s="${s[0]}" style="cursor:pointer"><div class="row sp"><div><span class="chip">Stage ${i+1}</span><div class="big" style="font-size:1.7rem;margin:8px 0 4px">${s[1]}</div><div>${s[2]}</div></div><button class="arrow" aria-label="Start ${s[1]}">↗</button></div></div>`).join('')+`<div class="card wh">${c.retake?'You can re-record answers, as in the BAE invite.':"One take per answer. Shell's email doesn't say you can re-record."} Your video stays in your browser and is never uploaded.</div>`;
 $('#bk').onclick=()=>show('home');document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>needCam(()=>({vjt,odvi,games})[e.dataset.s]()))}

/* ---- Shell VJT ---- */
const V=[{t:'Safety',q:'On site you see a contractor working at height without a harness. They say it takes five minutes.',o:[['Stop the work, make sure they are safe, then report it.',2,'Safety comes before schedule.'],['Remind them to be careful and mention it later.',1,'Right instinct, but the risk is immediate.'],['Ask a colleague if this is normal first.',0,'Delays action.'],['Say nothing. You are only a visitor.',0,'Ignores the duty to act.']]},
{t:'Integrity',q:'A supplier sends you a gift well above company limits just before a contract decision you influence.',o:[['Decline or return it, explain the policy and log it.',2,'Protects independence and is transparent.'],['Accept it but share it with the team.',1,'Still breaks the limit.'],['Keep it quietly. It is only a thank-you.',0,'Perceived conflict of interest.'],['Accept it and favour them slightly.',0,'Compromises fairness.']]},
{t:'Honesty',q:'You find a wrong figure in tomorrow\'s client analysis. Your manager is unavailable.',o:[['Verify it, document it and message your manager and the owner with options now.',2,'Honest, fast and visible.'],['Quietly fix it and present the new number without saying.',1,'Fixes it but hides the change.'],['Present the original and mention doubts only if asked.',0,'Knowingly presenting a doubtful number.'],['Pull your section and tell no one.',0,'Leaves the team unaware.']]},
{t:'Respect',q:'A teammate keeps interrupting a colleague, who has stopped contributing.',o:[['Speak to the teammate privately and invite the colleague to share next time.',2,'Respectful and restores space to speak.'],['Call it out in front of everyone.',1,'May escalate.'],['Support the colleague privately only.',1,'The behaviour continues.'],['Ignore it.',0,'Fails the respect value.']]},
{t:'Priorities',q:'Two urgent tasks are due today and you can only finish one.',o:[['Tell both parties what you can deliver, ask your manager which matters more, agree a plan.',2,'Transparent trade-off.'],['Finish your own report first.',1,'Reliable but ignores the wider impact.'],['Help the other team and stay silent on the late report.',0,'Hidden slippage.'],['Rush both and accept lower quality.',0,'Hides a quality risk.']]}];
function vjt(){const me=++alive,qs=shf(V).map(x=>({...x,o:shf(x.o)}));let i=0,sc=[],miss=[];pip(true);
 const show1=()=>{if(i>=qs.length)return end();const s=qs[i];app.innerHTML=`<div class="meta">Scenario ${i+1} of ${qs.length} · <span id="tm">1:30</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="card nv"><h2>${s.q}</h2></div>${s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join('')}<div id="f"></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));tick(90,()=>pick(-1),upd);
  function pick(k){if(me!==alive)return;stop();const v=k<0?0:s.o[k][1];sc.push(v);if(v<2)miss.push(s.t);document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;b.classList.add(['b','m','g'][s.o[j][1]]);b.insertAdjacentHTML('beforeend',`<span class="why">${s.o[j][2]}</span>`)});$('#f').innerHTML=`<button class="pill dk" id="n" style="margin-top:8px">${i+1<qs.length?'Next':'See results'}</button>`;$('#n').onclick=()=>{i++;show1()}}};
 const end=()=>{const p=Math.round(sc.reduce((a,b)=>a+b,0)/(qs.length*2)*100);D.vjt.push({p,miss,t:Date.now()});save();pip(false);app.innerHTML=`<h1>Try-out done</h1><div class="card ye"><div class="big">${p}%</div>judgement score</div><div class="card wh">${miss.length?'Revisit: '+[...new Set(miss)].join(', '):'You chose the best response every time.'}</div><div class="row"><button class="pill dk" id="d">Dashboard</button><button class="pill" id="s">Next stage</button></div>`;$('#d').onclick=()=>show('dash');$('#s').onclick=()=>show('co')};show1()}

/* ---- Video interview (both companies) ---- */
function odvi(){const c=CO[co],qs=shf(c.Q).slice(0,5),me=++alive;let i=0,tx='',sp=false,rec,ch=[],sr,t0=0;
 const qc=h=>`<div class="meta">Question ${i+1} of ${qs.length} · ${qs[i][1]}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="card nv"><h2>${qs[i][0]}</h2></div>${h}`;
 function prep(){app.innerHTML=qc(`<div class="card wh"><div class="meta">Preparation time</div><div class="big" id="tm">0:30</div><video id="cam" autoplay muted playsinline style="margin-top:10px"></video><button class="pill dk" id="go" style="margin-top:10px">Start answering now</button></div>`);$('#cam').srcObject=stream;$('#go').onclick=ans;tick(30,ans,upd)}
 function ans(){if(me!==alive)return;stop();t0=Date.now();ch=[];try{rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&ch.push(e.data);rec.start()}catch(e){rec=null}
  app.innerHTML=qc(`<div class="card wh"><div class="meta">Recording</div><div class="big" id="tm">2:00</div><video id="cam" autoplay muted playsinline style="margin-top:10px"></video><textarea id="tx" aria-label="Transcript" placeholder="Your words appear here as you speak (Chrome or Edge). You can edit before finishing."></textarea><button class="pill dk" id="fin" style="margin-top:10px">Finish answer</button></div>`);$('#cam').srcObject=stream;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{sr=new SR();sr.continuous=true;sr.interimResults=false;sr.lang='en-GB';sr.onresult=e=>{let s='';for(let k=e.resultIndex;k<e.results.length;k++)if(e.results[k].isFinal)s+=e.results[k][0].transcript+' ';if(s){sp=true;const t=$('#tx');t.value+=(t.value?' ':'')+s}};sr.onend=()=>{if(sr&&tm)try{sr.start()}catch(e){}};sr.start()}catch(e){sr=null}}
  $('#fin').onclick=fin;tick(120,fin,upd)}
 function fin(){if(me!==alive)return;stop();const secs=Math.max(1,Math.round((Date.now()-t0)/1000));tx=($('#tx')||{}).value||'';const s=sr;sr=null;if(s)try{s.stop()}catch(e){}
  const go=b=>review(secs,b?URL.createObjectURL(b):'');if(rec&&rec.state!=='inactive'){rec.onstop=()=>go(new Blob(ch,{type:rec.mimeType}));rec.stop()}else go(null)}
 function review(secs,url){const a=an(tx,secs,sp,co);app.innerHTML=qc(`${url?`<video controls src="${url}"></video>`:''}${fb(a,co)}<div class="row" style="margin-top:12px">${c.retake?'<button class="pill" id="rr">Re-record</button>':''}<button class="pill dk" id="nx">${i+1<qs.length?'Keep and continue':'Finish'}</button></div>`);
  if(c.retake)$('#rr').onclick=()=>{sp=false;prep()};
  $('#nx').onclick=()=>{D.ans.push({co,q:qs[i][0],o:a.overall,sp:a.spec,cf:a.conf,fl:a.flags,v:a.vals,t:Date.now()});save();i++;if(i<qs.length){sp=false;prep()}else{app.innerHTML=`<h1>Interview done</h1><div class="card ye">Your results are on the dashboard.</div><button class="pill dk" id="d">Open dashboard</button>`;$('#d').onclick=()=>show('dash')}}}
 prep()}

/* ---- BAE game-based assessments (generic examples) ---- */
function gEnd(title,st,note){D.games.push({g:title,s:st.map(x=>x[0]+': '+x[1]).join(', '),t:Date.now()});save();pip(false);app.innerHTML=`<h1>${title}</h1><div class="card mi">${st.map(x=>`<span style="margin-right:22px"><span class="big">${x[1]}</span><br>${x[0]}</span>`).join('')}<p>${note}</p></div><div class="row"><button class="pill dk" id="a">Play again</button><button class="pill" id="b">All games</button></div>`;$('#a').onclick=()=>({'Balloon risk':gB,'Number and data reasoning':gR,'Focus and reaction':gF})[title]();$('#b').onclick=games}
function games(){alive++;stop();pip(true);app.innerHTML=`<button class="pill" id="bk">← Back</button><h1>Game-based assessments</h1><p>BAE's invite doesn't name its games, so these are generic examples of the usual types. Most have no single right answer: stay calm and consistent.</p>`+[['Balloon risk','Pump for points, bank before it pops.','ye',gB],['Number and data reasoning','6 questions in 90 seconds.','mi',gR],['Focus and reaction','Tap green dots, ignore red.','pk',gF]].map((g,i)=>`<div class="card ${g[2]}"><div class="row sp"><div><b>${g[0]}</b><div>${g[1]}</div></div><button class="arrow" data-g="${i}" aria-label="Play ${g[0]}">↗</button></div></div>`).join('');
 $('#bk').onclick=()=>show('co');document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>[gB,gR,gF][+b.dataset.g]())}
function gB(){const me=++alive;pip(true);let n=0,bank=0,pp=0,lim=0,bk=[],pops=0;const N=6,nb=()=>{pp=0;lim=1+Math.floor(Math.random()*16);dr()};
 function dr(m=''){app.innerHTML=`<div class="meta">Balloon ${n+1} of ${N}</div><div class="card wh" style="text-align:center"><div style="height:230px;display:grid;place-items:center"><div style="width:${40+pp*13}px;height:${40+pp*13}px;max-width:220px;max-height:220px;border-radius:50%;background:var(--bl)"></div></div><b>Banked ${bank}</b> · this balloon ${pp*10} ${m}<div class="row" style="justify-content:center;margin-top:10px"><button class="pill dk" id="pu">Pump +10</button><button class="pill" id="bk" ${pp?'':'disabled'}>Bank it</button></div></div>`;
  $('#pu').onclick=()=>{if(me!==alive)return;pp++;if(pp>=lim){pops++;n++;if(n>=N)return fin();nb();dr('It popped!')}else dr()};$('#bk').onclick=()=>{bank+=pp*10;bk.push(pp);n++;n>=N?fin():nb()}}
 function fin(){const a=avg(bk);gEnd('Balloon risk',[['Banked',bank],['Pops',pops],['Avg pumps',a.toFixed(1)]],a>=11?'High risk appetite. Fine if deliberate, but note the pops.':a>=6?'A balanced approach.':'Cautious. Safe, but points were left on the table.')}nb()}
const RQ=[['2, 6, 18, 54, ?',[108,148,162,216],162],['5, 8, 14, 23, 35, ?',[47,50,52,55],50],['3, 5, 9, 17, 33, ?',[49,59,65,67],65],['Units: Q1 120, Q2 150, Q3 135, Q4 195. Largest % rise on the previous quarter?',['Q1','Q2','Q3','Q4'],'Q4'],['Site A: 4% error rate over 500 checks. Site B: 5% over 300. Total errors?',[30,35,45,9],35],['Mean of 12, 15, 18, 20, 25?',[17,18,19,20],18]];
function gR(){const me=++alive,qs=shf(RQ);pip(true);let i=0,ok=0,l=90;const show1=()=>{if(i>=qs.length)return fin();const q=qs[i];app.innerHTML=`<div class="meta">Question ${i+1} of ${qs.length} · <span id="tm">${mmss(l)}</span></div><div class="card nv"><h2>${q[0]}</h2></div>${shf(q[1]).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(String(q[2])===b.dataset.o)ok++;i++;show1()})};
 function fin(){stop();gEnd('Number and data reasoning',[['Correct',ok+'/'+qs.length],['Time used',mmss(90-l)]],ok>=5?'Strong numerical reasoning.':ok>=3?'Solid. Check percentage and mean questions carefully.':'Revise percentage change, series differences and averages.')}
 stop();tm=setInterval(()=>{if(me!==alive){stop();return}l--;upd(l);if(l<=0)fin()},1000);show1()}
function gF(){const me=++alive;pip(true);let n=0,hit=0,fa=0,miss=0,rt=[];const N=30;app.innerHTML=`<div class="meta">Tap GREEN dots only. Ignore red.</div><div class="bar"><i id="pb" style="width:0"></i></div><div class="field" id="f"></div>`;
 function tr(){if(me!==alive)return;if(n>=N)return fin();n++;$('#pb').style.width=n/N*100+'%';const f=$('#f'),g=Math.random()<.7,e=document.createElement('button');e.className='dot';e.style.background=g?'#1b9e4b':'#d22';e.setAttribute('aria-label',g?'green':'red');e.style.left=Math.random()*(f.clientWidth-60)+'px';e.style.top=Math.random()*(f.clientHeight-60)+'px';f.appendChild(e);const t=Date.now();let c=false;e.onclick=()=>{if(c)return;c=true;if(g){hit++;rt.push(Date.now()-t)}else fa++;e.remove()};setTimeout(()=>{if(!c&&g)miss++;e.remove();setTimeout(tr,350)},900)}
 function fin(){gEnd('Focus and reaction',[['Hits',hit],['Missed',miss],['False taps',fa],['Avg ms',Math.round(avg(rt))]],fa>3?'Several taps on red: look before tapping.':miss>4?'You missed several greens: keep your eyes moving.':'Accurate and controlled.')}tr()}

/* ---- Dashboard ---- */
function dash(){const A=D.ans;if(!A.length&&!D.vjt.length){app.innerHTML=`<h1>Your dashboard</h1><div class="card wh">Practise an interview first. Your scores and what to improve will appear here.</div>`;return}
 const cnt={};A.forEach(a=>a.fl.forEach(f=>cnt[f]=(cnt[f]||0)+1));const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3),cl=['li','pk','bl'];
 const last=A.slice(-12),vm={};D.vjt.forEach(v=>v.miss.forEach(m=>vm[m]=(vm[m]||0)+1));
 app.innerHTML=`<h1>Your dashboard</h1><div class="grid2"><div class="card ye"><div class="big">${Math.round(avg(A.map(a=>a.o)))}</div>Avg overall</div><div class="card mi"><div class="big">${Math.round(avg(A.map(a=>a.sp)))}</div>Specificity</div><div class="card bl"><div class="big">${Math.round(avg(A.map(a=>a.cf)))}</div>Delivery confidence</div><div class="card pk"><div class="big">${A.length}</div>Answers practised</div></div>
 <div class="card nv"><b>Score trend</b><div style="display:flex;align-items:flex-end;gap:5px;height:100px;margin-top:10px">${last.length?last.map(a=>`<div title="${a.o}" style="flex:1;background:var(--mi);border-radius:6px 6px 0 0;height:${Math.max(a.o,4)}%"></div>`).join(''):'No answers yet'}</div></div>
 <h2 style="margin-top:18px">What to improve</h2>${top.length?top.map((t,i)=>`<div class="card ${cl[i]}"><span class="chip">${t[1]} of ${A.length} answers</span><div style="font-weight:800;font-size:1.2rem;margin:6px 0">${FL[t[0]][0]}</div>${FL[t[0]][1]}</div>`).join(''):'<div class="card wh">No repeated weak spots yet. Nice.</div>'}
 ${Object.keys(CO).map(k=>{const s=A.filter(a=>a.co===k);if(!s.length)return'';return`<div class="card wh"><b>${CO[k].name} values</b><div class="row" style="margin-top:8px">${CO[k].vals.map(v=>{const p=Math.round(s.filter(a=>a.v[v[0]]).length/s.length*100);return`<span class="chip" style="background:var(${p>=50?'--mi':'--pk'})">${v[0]} ${p}%</span>`}).join('')}</div><div class="meta">Share of answers where the value showed up.</div></div>`}).join('')}
 <div class="card wh"><b>Try-out and games</b><div>${D.vjt.length?`Latest Shell try-out: ${D.vjt[D.vjt.length-1].p}%.`+(Object.keys(vm).length?' Most missed: '+Object.entries(vm).sort((a,b)=>b[1]-a[1])[0][0]+'.':''):'No try-out yet.'}</div>${D.games.slice(-3).reverse().map(g=>`<div class="meta">${g.g}: ${g.s}</div>`).join('')}</div>
 <button class="pill" id="rs">Clear my data</button>`;$('#rs').onclick=()=>{if(confirm('Delete all saved practice data?')){D={ans:[],vjt:[],games:[]};save();dash()}}}

function show(v){alive++;stop();pip(false);document.querySelectorAll('nav.bot button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='dash'?'dash':'home')));({home,co:coPage,dash})[v]();window.scrollTo(0,0)}
document.querySelectorAll('nav.bot button').forEach(b=>b.onclick=()=>show(b.dataset.v));
show('home');
</script>
</body>
</html>
