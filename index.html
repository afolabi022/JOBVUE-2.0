()=>{const x=R(2,12),y=R(1,x-1),A=3*x+y,B=x-y;return{t:'Algebra',q:`If 3x + y = ${A} and x − y = ${B}, what is the value of x?`,...mk(x,[y,x+1,x-1,A-B,x+2],undefined,5),why:`Add the equations: 4x = ${A+B}, so x = ${x}. (Then y = ${y}.)`}},
()=>{const F=R(2,9)*1000,v=R(2,8)*50,p=v+R(2,6)*50,ans=F/(p-v);return{t:'Algebra',q:`A workshop pays a fixed cost of ${naira(F)} per month. Each item costs ${naira(v)} to make and sells for ${naira(p)}. How many items must it sell in a month to cover all of its costs?`,...mk(Math.ceil(ans),[Math.ceil(F/p),Math.ceil(F/v),Math.ceil(ans)+10,Math.ceil(ans)*2,Math.max(1,Math.ceil(ans)-10)],undefined,5),why:`Each item adds ${naira(p-v)} towards the fixed cost. ${naira(F)} ÷ ${naira(p-v)} = ${ans}${Number.isInteger(ans)?'':', so round up to '+Math.ceil(ans)}.`}},
()=>{const w=R(2,15),P=6*w;return{t:'Geometry',q:`A rectangle has a perimeter of ${P} cm and its length is twice its width. What is its area in square centimetres?`,...mk(2*w*w,[w*w,4*w*w,P*w,(P/2)**2/4,2*w*w+w],undefined,5),why:`Perimeter = 2(w + 2w) = 6w = ${P}, so w = ${w} and length = ${2*w}. Area = ${w} × ${2*w} = ${2*w*w}.`}},
()=>{const t=pick([40,48,60,72,80,90,96]),ans=1440/t;return{t:'Rates',q:`A runner covers 400 metres in ${t} seconds at a steady pace. What is the speed in kilometres per hour?`,...mk(ans,[ans*2,ans/2,400/t,ans+6,ans-6],x=>x+' km/h',5),why:`In one hour there are ${3600/t} runs of ${t} seconds, each 400 m: ${3600/t*400} m = ${ans} km, so ${ans} km/h.`}},
()=>{let n,m,f,B;do{[m,f]=pick([[3,2],[4,3],[5,3],[4,2],[5,4]]);n=2*R(2,8);B=n*(f-1)/(m-f)}while(!Number.isInteger(B)||B<=0);return{t:'Algebra',q:`Ada is ${m} times as old as Bayo. In ${n} years, Ada will be ${f} times as old as Bayo. How old is Bayo now?`,...mk(B,[B+n,n,B*2,B+1,n+B/2+1],undefined,5),why:`Let Bayo be b: ${m}b + ${n} = ${f}(b + ${n}), so ${m-f}b = ${n*(f-1)}, b = ${B}.`}},
()=>{const[a,b]=pick([[6,8],[4,10],[9,12],[6,15],[8,12],[10,25]]),L=lcm(a,b);return{t:'Number properties',q:`One light flashes every ${a} seconds and another every ${b} seconds. They flash together at the start. After how many seconds do they next flash together?`,...mk(L,[a*b,a+b,L/2,L*2,Math.abs(a-b)],x=>x+' seconds',5),why:`The lowest common multiple of ${a} and ${b} is ${L}.`}}];

/* ---- KPMG quantitative bank: supplied practice questions. Questions that relied on a table, graph or figure were left out. Row: [question, options, correct index, explanation, topic] ---- */
const QB=[
["The numbers of cars sold at a dealership on six of the last seven business days were 4, 7, 2, 8, 3 and 6. The number sold on the seventh day was either 2, 4 or 5. For which of these values does the mean for the seven days equal the median? I. 2  II. 4  III. 5",["II only","III only","I and II only","II and III only","I, II and III"],1,"The six known numbers total 30. Only a seventh value of 5 gives a mean of 35 ÷ 7 = 5 that equals the median (5). With 2 the mean is about 4.57 and with 4 about 4.86, both different from the median of 4.","Statistics"],
["Carmen, Juan, Maria and Rafael drove an average (mean) of 80 miles each. Carmen drove 72 miles, Juan 78 and Maria 83. How many miles did Rafael drive?",["80","82","85","87","89"],3,"Total = 4 × 80 = 320. Carmen, Juan and Maria drove 233, so Rafael drove 320 − 233 = 87.","Averages"],
["A salesperson receives a commission of 15% of the first $500 in sales and 20% of all additional sales that week. What is the commission on weekly sales of $1,300?",["$195","$227","$235","$260","$335"],2,"15% of 500 = 75. 20% of the extra 800 = 160. Total = $235.","Percentages"],
["A restaurant has 1,040 cover letters and 3,000 coupons. Each envelope holds 1 cover letter and 2 coupons. If all the cover letters are used, how many coupons remain?",["920","1,040","1,500","1,960","2,080"],0,"1,040 envelopes use 2 × 1,040 = 2,080 coupons. 3,000 − 2,080 = 920.","Rates"],
["List S is 10 consecutive odd integers and list T is 5 consecutive even integers. The least integer in S is 7 more than the least integer in T. How much greater is the mean of S than the mean of T?",["2","7","8","12","22"],3,"If T starts at t, its mean is t + 4. S starts at t + 7, so its mean is (t + 7) + 9 = t + 16. The difference is 12.","Averages"],
["The price of a coat is $500. If it is reduced by $150, by what percent is the price reduced?",["10%","15%","20%","25%","30%"],4,"150 ÷ 500 = 30%.","Percentages"],
["(1/2 − 1/3) + (1/3 − 1/4) + (1/4 − 1/5) + (1/5 − 1/6) =",["−1/6","0","1/3","1/2","2/3"],2,"The middle terms cancel, leaving 1/2 − 1/6 = 1/3.","Fractions"],
["A family paid a boy $11 per week to mow their lawn and $4 per day to feed and walk their dog. If they were away for exactly 3 weeks, how much did they pay him?",["$45","$54","$71","$95","$117"],4,"Mowing: 3 × 11 = 33. Dog: 21 days × 4 = 84. Total = $117.","Rates"],
["Last year $48,000 of a store's profit was shared by its 2 owners and their 10 employees. Each owner received 3 times as much as each employee. How much did each owner receive?",["$12,000","$9,000","$6,000","$4,000","$3,000"],1,"Let each employee get x. 10x + 2(3x) = 16x = 48,000, so x = 3,000 and each owner gets $9,000.","Ratios"],
["Rose exchanged $500 for euros at 0.80 euro per dollar and spent 3/4 of the euros. She exchanged the remaining euros back at $1.20 per euro. How many dollars did she receive?",["$60.00","$80.00","$100.00","$120.00","$140.00"],3,"500 × 0.80 = 400 euros. She keeps 1/4 = 100 euros. 100 × 1.20 = $120.","Currency"],
["Bouquets use white and red tulips in the same ratio in each bouquet. With 15 white and 85 red tulips available, what is the greatest number of bouquets that can be made using all the tulips?",["3","5","8","10","13"],1,"The greatest number of identical bouquets is the greatest common factor of 15 and 85, which is 5.","Ratios"],
["The Smith family's weekly grocery bills over 7 weeks were $74, $69, $64, $79, $64, $84 and $77. What was the mean weekly bill?",["$64","$70","$73","$74","$85"],2,"The total is 511. 511 ÷ 7 = 73.","Averages"],
["125% of 5 =",["5.125","5.25","6","6.125","6.25"],4,"1.25 × 5 = 6.25.","Percentages"],
["9 neighbourhoods had power failures lasting 34, 29, 27, 46, 18, 25, 12, 35 and 16 minutes. What was the median duration?",["34","29","27","25","18"],2,"In order: 12, 16, 18, 25, 27, 29, 34, 35, 46. The 5th value is 27.","Statistics"],
["At a constant 32 miles per hour a motorboat uses 24 gallons of fuel per hour. What is its fuel consumption in miles per gallon?",["2/3","3/4","4/5","4/3","3/2"],3,"32 ÷ 24 = 4/3 miles per gallon.","Rates"],
["A technician makes a round trip by the same route. If the technician completes the drive to the center and then 10% of the drive from the center, what percent of the round trip is complete?",["5%","10%","25%","40%","55%"],4,"The round trip is 2 legs. Completed: 1 + 0.1 = 1.1 legs, and 1.1 ÷ 2 = 55%.","Percentages"],
["From 2000 to 2003 a company's staff increased by a factor of 1/4 (a quarter more). From 2003 to 2006 it decreased by a factor of 1/3. If there were 100 employees in 2006, how many were there in 2000?",["200","120","100","75","60"],1,"x × 5/4 × 2/3 = 5x/6 = 100, so x = 120.","Percentages"],
["Which of the following must be true about the mean and median of 5 consecutive integers? I. The mean is one of the integers. II. The median is one of the integers. III. The median equals the mean.",["I only","II only","III only","I and II only","I, II and III"],4,"For 5 consecutive integers the middle value is both the median and the mean, so all three statements hold.","Statistics"],
["16 coins, each worth either 10 cents or 25 cents, have a total value of $2.35. How many are 25-cent coins?",["3","5","7","9","11"],1,"If all were 10c the total would be 160c. The extra 75c ÷ 15c per swap = 5 quarters.","Algebra"],
["A retailer bought eggs at $2.80 per dozen and sold them at 3 eggs for $0.90. What was the gross profit on 5 dozen eggs?",["$0.90","$2.40","$4.00","$11.30","$12.00"],2,"Cost: 5 × 2.80 = 14.00. Sales: 60 eggs = 20 groups × 0.90 = 18.00. Profit = $4.00.","Percentages"],
["A set of 24 cards is numbered 1 to 24. One card is drawn at random. What is the probability that its number is divisible by both 2 and 3, or divisible by 7?",["3/24","4/24","7/24","8/24","17/24"],2,"Multiples of 6: 6, 12, 18, 24 (4). Multiples of 7: 7, 14, 21 (3). No overlap, so 7/24.","Probability"],
["Phyllis can take an annual salary of $35,000 with no commission, or $10,000 plus a 20% commission on her total sales. What sales give the same pay with either method?",["$100,000","$120,000","$125,000","$130,000","$132,000"],2,"10,000 + 0.2S = 35,000, so S = 25,000 ÷ 0.2 = $125,000.","Algebra"],
["If 1 < x < y < z, which of the following has the greatest value?",["z(x + 1)","z(y + 1)","x(y + z)","y(x + z)","z(x + y)"],4,"Expand: zx + z, zy + z, xy + xz, xy + yz, xz + yz. Since z > y and x > 1, xz + yz is the largest.","Algebra"],
["Set X is eight consecutive integers. Set Y contains every integer from adding 4 to each member of X and every integer from subtracting 4 from each member of X. How many more integers are in Y than in X?",["0","4","8","12","16"],2,"If X runs from n to n + 7, then X − 4 gives n − 4 to n + 3 and X + 4 gives n + 4 to n + 11, with no overlap. Y has 16 integers, 8 more than X.","Number properties"],
["Which is closest to 60.2 ÷ (1.03 × 4.86)?",["10","12","13","14","15"],1,"1.03 × 4.86 ≈ 5.0, and 60.2 ÷ 5.0 ≈ 12.","Estimation"],
["Thabo owns 140 books: paperback fiction, paperback nonfiction or hardcover nonfiction. He has 20 more paperback nonfiction than hardcover nonfiction, and twice as many paperback fiction as paperback nonfiction. How many hardcover nonfiction books does he own?",["10","20","30","40","50"],1,"Let hardcover = h. Then h + (h + 20) + 2(h + 20) = 4h + 60 = 140, so h = 20.","Algebra"],
["The mean of the four numbers 3, 15, 32 and (N + 1) is 18. N =",["19","20","21","22","29"],2,"The total is 72. 3 + 15 + 32 + N + 1 = 51 + N = 72, so N = 21.","Averages"],
["If x > 0, x/50 + x/25 is what percent of x?",["6%","25%","37%","60%","75%"],0,"x/50 + 2x/50 = 3x/50 = 0.06x, which is 6% of x.","Percentages"],
["Car X travelled north at 1 mile per minute and used fuel at 5 gallons every 2 hours. If it used exactly 3.75 gallons, how many miles did it travel?",["36","37.5","40","80","90"],4,"3.75 ÷ 5 = 0.75 of 2 hours = 1.5 hours = 90 minutes, so 90 miles.","Rates"],
["Cheryl bought 5 hollow pine doors and 6 solid oak doors. An oak door's regular price is twice a pine door's, but oak doors were 25% off. If a pine door's regular price was $40, what was the total price of all 11 doors?",["$320","$540","$560","$620","$680"],2,"Pine: 5 × 40 = 200. Oak regular price is $80, so after 25% off it is $60. 6 × 60 = 360. Total = $560.","Percentages"],
["A store will order 25 crates of apples of three varieties, each crate holding one variety. It will order more crates of Winesap than McIntosh and more than Rome. What is the least possible number of Winesap crates?",["7","8","9","10","11"],2,"With 9 Winesap, the other 16 can split 8 and 8, both fewer than 9. With 8 Winesap the other 17 would need one variety of 9 or more. So 9.","Number properties"],
["A bicycle store bought two bicycles for $250 and $375 and sold both for a total gross profit of $250. If it sold one for $450, which could be its gross profit on the other?",["$75","$100","$125","$150","$175"],4,"Total sales = 625 + 250 = 875, so the other bike sold for 875 − 450 = 425. If it was the $250 bike, profit = 175. If it was the $375 bike, profit = 50. Only $175 is offered.","Algebra"],
["If k² = m², which of the following must be true?",["k = m","k = −m","k = |m|","k = −|m|","|k| = |m|"],4,"Taking square roots gives |k| = |m|. k could be m or −m, so the first four need not hold.","Algebra"],
["Makoto, Nishi and Ozuro were paid $780 in proportion to hours worked: 15, 20 and 30 hours. How much was Makoto paid?",["$52","$117","$130","$180","$234"],3,"Total hours = 65. Makoto: 15/65 × 780 = $180.","Ratios"],
["If x is a positive integer and 4^x − 3 = y, which of the following CANNOT be a value of y?",["1","7","13","61","253"],1,"For x = 1, 2, 3, 4 the values are 1, 13, 61, 253. A value of 7 would need 4^x = 10, which is impossible.","Exponents"],
["If (1 − 1.25)N = 1, then N =",["−400","−140","−4","4","400"],2,"−0.25N = 1, so N = −4.","Algebra"],
["The quotient when a number is divided by 2/3 is 9/2. What is the number?",["4/27","1/3","3","6","27/4"],2,"Number = 9/2 × 2/3 = 3.","Fractions"],
["The price of gasoline rose from $1.65 to $1.82 per gallon. Sally paid $26.40 last week. How much more will she pay this week for the same amount?",["$1.70","$2.55","$2.64","$2.72","$2.90"],3,"26.40 ÷ 1.65 = 16 gallons. The rise is 0.17 per gallon, and 16 × 0.17 = $2.72.","Rates"],
["If 2x + y = 7 and x + 2y = 5, then (x + y) ÷ 3 =",["1","4/3","17/5","18/5","4"],1,"Adding the equations: 3x + 3y = 12, so x + y = 4 and (x + y) ÷ 3 = 4/3.","Algebra"],
["City X has a population 4 times that of City Y, and City Y has twice the population of City Z. What is the ratio of X to Z?",["1:8","1:4","2:1","4:1","8:1"],4,"X = 4Y and Y = 2Z, so X = 8Z, a ratio of 8:1.","Ratios"],
["S = 1 + 1/2² + 1/3² + 1/4² + 1/5² + 1/6² + 1/7² + 1/8² + 1/9² + 1/10². Which is true?",["S > 3","S = 3","2 < S < 3","S = 2","S < 2"],4,"Adding the terms gives about 1.55, which is less than 2.","Estimation"],
["Between 0.3% and 0.5% of units made are defective. The retail price is $2,500 and defective units are fully refunded. How much should be expected for refunds on 20,000 units?",["Between $15,000 and $25,000","Between $30,000 and $50,000","Between $60,000 and $100,000","Between $150,000 and $250,000","Between $300,000 and $500,000"],3,"Defective units: 60 to 100. Refunds: 60 × 2,500 = $150,000 up to 100 × 2,500 = $250,000.","Percentages"],
["Which is closest to √(4.2 × 1,590 ÷ 15.7)?",["20","40","60","80","100"],0,"4.2 × 1,590 = 6,678 and 6,678 ÷ 15.7 ≈ 425. √425 ≈ 20.6, so 20.","Estimation"],
["The weekly salaries of 5 employees total $3,250. If each salary rises by 10%, by how much does the mean weekly salary rise?",["$52.50","$55.00","$57.50","$62.50","$65.00"],4,"The current mean is 650. A 10% rise is 65.","Averages"],
["Last week Chris earned x dollars per hour for the first 40 hours and $22 per hour beyond 40. He worked 48 hours and earned $816. What is x?",["13","14","15","16","17"],3,"Overtime: 8 × 22 = 176. So 40x = 816 − 176 = 640 and x = 16.","Algebra"],
["The value of (7/8 + 1/9) ÷ (1/2) is closest to which of the following?",["2","3/2","1","1/2","0"],0,"7/8 + 1/9 = 71/72, and dividing by 1/2 gives 71/36 ≈ 1.97, closest to 2.","Fractions"],
["The positive two-digit integers x and y have the same digits in reverse order. Which of the following must be a factor of x + y?",["6","9","10","11","14"],3,"If x = 10a + b then y = 10b + a, and x + y = 11(a + b).","Number properties"],
["In a sequence of 8 numbers, each number after the first is 1 more than the previous one. The first number is −5. How many of the numbers are positive?",["None","One","Two","Three","Four"],2,"The sequence is −5, −4, −3, −2, −1, 0, 1, 2. Two are positive.","Sequences"],
["s oranges are packaged in boxes holding r oranges each, with none left over. When n boxes have been completely filled, how many boxes remain to be filled?",["s − nr","s − n/r","rs − n","s/n − r","s/r − n"],4,"There are s/r boxes in total, so s/r − n remain.","Algebra"],
["If 0 < a < b < c, which must be true? I. 2a > b + c  II. c − a > b − a  III. c/a < b/a",["I only","II only","III only","I and II","II and III"],1,"I is false since 2a < b + c. II is true because c > b. III is false because c/a > b/a.","Inequalities"],
["Company Q will sell a product at $2 per unit. Variable costs are 40% of the selling price and fixed costs are $5,040 per production run. How many units must be sold for revenue to equal total costs?",["4,200","3,150","2,520","2,100","1,800"],0,"Each unit contributes 2 − 0.80 = $1.20 towards fixed costs. 5,040 ÷ 1.20 = 4,200.","Algebra"],
["A business invests $9,900 in equipment. Each unit costs $0.65 to make and sells for $1.20. How many units must be sold for revenue to equal total expense including the equipment?",["12,000","14,500","15,230","18,000","20,000"],3,"Each unit earns 0.55 towards the equipment. 9,900 ÷ 0.55 = 18,000.","Algebra"],
["When n litres of fuel were added to a tank already 1/3 full, it became 7/9 full. In terms of n, what is the tank's capacity in litres?",["10n/9","4n/3","3n/2","9n/4","7n/3"],3,"n fills 7/9 − 1/3 = 4/9 of the tank, so the capacity is 9n/4.","Fractions"],
["Kevin invested $8,000 for one year at 6% simple interest and $10,000 for one year at 8% compounded semiannually. What total interest did he earn?",["$880","$1,088","$1,253","$1,280","$1,296"],4,"First: 8,000 × 0.06 = 480. Second: 10,000 × 1.04² = 10,816, so 816 interest. Total = $1,296.","Interest"],
["A harvest from an orchard was 350 bushels. If x trees each yielded 10 bushels, what fraction of the harvest came from these x trees?",["x/35","1 − x/35","10x","35 − x","350 − 10x"],0,"10x ÷ 350 = x/35.","Fractions"],
["In a certain fraction the denominator is 16 greater than the numerator. The fraction equals 80%. What is the denominator?",["32","64","72","80","120"],3,"n ÷ (n + 16) = 0.8, so 0.2n = 12.8, n = 64. The denominator is 80.","Fractions"],
["Greg is paid $2.00 per unit for the first 40 units each day and $2.50 for each additional unit that day. He assembled at least 30 units on each of two days and was paid $180 in total. What is the greatest possible number of units he assembled on one of the days?",["48","52","56","60","64"],2,"Take 30 units on the lighter day (pay $60). The other day pays $120: the first 40 units give $80, and $40 more buys 16 units at $2.50. 40 + 16 = 56.","Algebra"],
["Which of the following is greatest?",["10√3","9√4","8√5","7√6","6√7"],1,"The values are about 17.32, 18.00, 17.89, 17.15 and 15.87.","Estimation"],
["Ben left at 8:00 a.m. heading east and Al left at 11:00 a.m. heading west. At a later time the data showed Al had averaged 40 mph, Ben 20 mph, and together they had driven 240 miles. What time was it?",["1:00 p.m.","2:00 p.m.","3:00 p.m.","5:00 p.m.","6:00 p.m."],1,"Let T be hours after 8:00. Ben drove 20T and Al drove 40(T − 3). 60T − 120 = 240, so T = 6, which is 2:00 p.m.","Rates"],
["A farmer cleared 90% of his land. Of the cleared land, 40% was planted with soybeans and 50% with wheat. The remaining 720 acres of cleared land was planted with corn. How many acres did he own?",["5,832","6,480","7,200","8,000","8,889"],3,"Corn is 10% of the cleared land, so cleared = 7,200. That is 90% of the total, so total = 8,000.","Percentages"],
["A population starts at 3 animals and doubles at the end of each month. What is the population at the end of 10 months?",["2³","3²","2(3¹⁰)","3(2¹⁰)","3(10²)"],3,"Doubling 10 times from 3 gives 3 × 2¹⁰.","Exponents"],
["If (1/3 + 1/4 + 1/5 + 1/6) = r(1/9 + 1/12 + 1/15 + 1/18), then r =",["1/3","4/3","3","4","12"],2,"Each term on the right is 1/3 of the matching term on the left, so the right-hand bracket is 1/3 of the left. Hence r = 3.","Fractions"],
["x and y are positive integers, y is a multiple of 5 and 3x + 4y = 200. x must be a multiple of which of the following?",["3","6","7","8","10"],4,"Let y = 5k. Then 3x = 200 − 20k, which works when k = 1, 4 or 7, giving x = 60, 40 or 20. Every possible x is a multiple of 10.","Number properties"],
["Which of the following can be written as an integer? I. (√82 + √82)²  II. (82)(√82)  III. (√82)(√82) ÷ 82",["None","I only","III only","I and II","I and III"],4,"I: (2√82)² = 328. II: 82√82 is not an integer. III: 82 ÷ 82 = 1.","Number properties"],
["One inlet pipe fills an empty tank to 1/2 capacity in 3 hours. A second pipe fills the same tank to 2/3 capacity in 6 hours. How many hours would both pipes together take to fill the empty tank?",["3.25","3.6","4.2","4.4","5.5"],1,"Rates: 1/6 and 1/9 of the tank per hour. Together 5/18, so the time is 18/5 = 3.6 hours.","Rates"],
["If x² − 2 < 0, which specifies all possible values of x?",["0 < x < 2","0 < x < √2","−√2 < x < √2","−2 < x < 0","−2 < x < 2"],2,"x² < 2 means −√2 < x < √2.","Inequalities"],
["x bicycles were sold in Western Europe in each of 1990 and 1993. Producers there had a 42% share in 1990 and 33% in 1993. Which represents the decrease in the annual number of bicycles produced and sold there from 1990 to 1993?",["9% of x/100","14% of x/100","75% of x/100","9% of x","14% of x"],3,"0.42x − 0.33x = 0.09x, which is 9% of x.","Percentages"],
["If k is a positive integer, what is the remainder when (k + 2)(k³ − k) is divided by 6?",["0","1","2","3","4"],0,"k³ − k = (k − 1)k(k + 1), so the product is four consecutive integers. That is always divisible by 24, so the remainder is 0.","Number properties"],
["Which of the following fractions is closest to 1/2?",["4/7","5/9","6/11","7/13","9/16"],3,"The gaps from 1/2 are 1/14 (4/7), 1/18 (5/9), 1/22 (6/11), 1/26 (7/13) and 1/16 (9/16). The smallest gap is 1/26, so 7/13.","Fractions"],
["If p ≠ 0 and p − (1 − p²)/p = r/p, then r =",["p + 1","3p − 1","p² + 1","2p² − 1","p² + p − 1"],3,"p − (1 − p²)/p = (p² − 1 + p²)/p = (2p² − 1)/p, so r = 2p² − 1.","Algebra"],
["The range of the six numbers 4, 3, 14, 7, 10 and x is 12. What is the difference between the greatest and least possible values of x?",["0","2","12","13","15"],3,"The current range is 14 − 3 = 11. x = 15 gives 15 − 3 = 12 and x = 2 gives 14 − 2 = 12. The difference is 13.","Statistics"],
["What number is 108 more than two-thirds of itself?",["72","144","162","216","324"],4,"n = 2n/3 + 108, so n/3 = 108 and n = 324.","Algebra"],
["A service provider charges c dollars for the first 50 hours per month and 40 cents for each 30 minutes beyond 50 hours. If x > 50 is an integer, which gives the charge in dollars for x hours?",["c + 0.40x","c + 0.80x","c + 0.40(x − 50)","c + 0.80(x − 50)","c + 0.40(2x − 50)"],3,"Each extra hour is two half-hours at $0.40, so $0.80 per extra hour: c + 0.80(x − 50).","Algebra"],
["A salesperson slowed from 100 km/h to 47 km/h. Approximately how many miles per hour was the speed reduced? (1 km ≈ 0.625 mile)",["29","33","53","63","75"],1,"The reduction is 53 km/h × 0.625 ≈ 33 mph.","Rates"],
["Company P had 15% more employees in December than in January. It had 460 in December. How many did it have in January?",["391","400","410","423","445"],1,"January × 1.15 = 460, so January = 400.","Percentages"],

function svgChart(kind,lab,val,min,max,step,unit){const W=440,H=230,L=44,R=12,T=18,B=30,iw=W-L-R,ih=H-T-B,y=v=>T+ih*(1-(v-min)/(max-min)),n=lab.length,sx=i=>L+iw*(i+.5)/n;let g='';
 for(let v=min;v<=max+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${+v.toFixed(1)}</text>`;
 if(kind==='bar'){const bw=iw/n*.55;g+=val.map((v,i)=>`<rect x="${sx(i)-bw/2}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.abs(y(v)-y(0))}" fill="var(--ac)" rx="3"/><text x="${sx(i)}" y="${y(v)-5}" text-anchor="middle">${v}</text>`).join('')}
 else g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mut)"/><path d="${val.map((v,i)=>(i?'L':'M')+sx(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>`+val.map((v,i)=>`<circle cx="${sx(i)}" cy="${y(v)}" r="4" fill="var(--ac)"/><text x="${sx(i)}" y="${y(v)-8}" text-anchor="middle">${v}</text>`).join('');
 g+=lab.map((l,i)=>`<text x="${sx(i)}" y="${H-10}" text-anchor="middle">${l}</text>`).join('');
 return`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Chart" style="margin-top:10px"><text x="${L}" y="11" style="font-size:10px">${unit}</text>${g}</svg>`}

/* Balloon risk (BART): burst point uniform 1-24, 5 points per pump. Expected-value optimum is 12 pumps. */
function gBart(){const me=++alive;cleanup();start('game');pip(true);const N=10,MAX=24,PTS=5,OPT=12;let n=0,bank=0,pumps=0,burst=R(1,MAX),log=[],lock=false;

 const paint=m=>{$('#bn').textContent=`Balloon ${Math.min(n+1,N)} of ${N}`;$('.bar i').style.width=n/N*100+'%';$('#bb').textContent=bank;$('#bp').textContent=pumps*PTS;$('#bm').textContent=m||'points on this balloon';$('#bl').style.transform=`scale(${(.45+pumps*.065).toFixed(3)})`;$('#bk').disabled=lock||!pumps;$('#pu').disabled=lock};

 const pump=()=>{if(me!==alive||lock)return;pumps++;if(pumps>=burst){lock=true;log.push({p:pumps,pop:true});$('#be').setAttribute('fill','var(--bad)');$('#bl').style.transform='scale(1.5)';say('Popped');paint('Popped! This balloon scores 0.');setTimeout(()=>{if(me===alive)nextB()},1100)}else paint()};

 const card=(title,id,prim,body)=>{const h=G(id);if(!h.length)return`<div class="card"><b>${title}</b><p class="mut sm">Not played yet.</p></div>`;const v=h.map(prim);return`<div class="card"><div class="row sp"><b>${title}</b>${spark(v)}</div><div class="mut sm">${h.length} play${h.length>1?'s':''} · best ${Math.max(...v)} · latest ${v[v.length-1]}</div>${body(h)}</div>`};
 out.push(card('Balloon risk','bart',x=>Math.round(Math.max(0,100-Math.min(100,Math.abs(x.m.adj-12)/12*100))),h=>{const m=h[h.length-1].m;return`<div class="row sp" style="margin-top:10px"><span>Avg pumps (unpopped)</span><b>${m.adj}</b></div>${gauge(m.adj,0,24,10,14)}<div class="mut sm">Green band = near the best balance (about 12). ${m.pops} popped, ${m.bank} points banked. Score = closeness to the optimum.</div>`}));
 out.push(card('Number and data reasoning','num',x=>Math.round(x.m.ok/x.m.n*100),h=>{const c={};h.forEach(x=>Object.entries(x.m.cats||{}).forEach(([k,[a,b]])=>{c[k]=c[k]||[0,0];c[k][0]+=a;c[k][1]+=b}));const m=h[h.length-1].m;return`<div class="mut sm" style="margin-top:8px">Latest: ${m.ok}/${m.n} in ${mmss(m.secs)}, ${Math.round(m.avgMs/1000)}s per question. Accuracy by topic across all plays:</div>${Object.entries(c).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[a,b]])=>hb(k,Math.round(a/b*100),a+' of '+b)).join('')}`}));
 out.push(card('Focus and reaction','gng',x=>x.m.acc,h=>{const m=h[h.length-1].m;return`<div class="grid c4" style="margin-top:10px"><div><b>${m.mrt} ms</b><div class="mut sm">Mean reaction</div></div><div><b>${m.srt} ms</b><div class="mut sm">Consistency (SD)</div></div><div><b>${m.ce}/${m.ng}</b><div class="mut sm">Wrong taps on red</div></div><div><b>${m.om}/${m.go}</b><div class="mut sm">Missed greens</div></div></div>`}));
 return out.join('')}

function allIg(){const o=[],P=(t,kind,ig,l,x)=>o.push({t,kind,s:ig.s,k:ig.k||{},c:ig.c,l,...x});
 D.ans.forEach(a=>{if(a.ig&&(flt==='all'||a.co===flt))P(a.t,'Interview',a.ig,a.q,{au:a.au,sn:a.sn})});
 if(flt==='all'||flt==='shell')D.vjt.forEach(v=>{if(v.ig)P(v.t,'Try-out',v.ig,'Virtual Job Try-out')});
 if(flt==='all'||flt==='bae')D.games.forEach(g=>{if(g.ig)P(g.t,'Game',g.ig,({bart:'Balloon risk',num:'Number reasoning',gng:'Focus and reaction'})[g.g]||g.g)});
 if(flt==='all'||flt==='kpmg'||flt==='deloitte')D.tests.forEach(x=>{if(x.ig)P(x.t,'Test',x.ig,KT[x.id]?KT[x.id].name:x.id)});
 return o.sort((a,b)=>a.t-b.t)}
function igOver(){const L=allIg();if(!L.length)return'';const m=Math.round(avg(L.slice(-10).map(x=>x.s))),sn=L.filter(x=>x.sn!=null).slice(-10),l=lvl(m);
 return`<div class="card row">${ring(sn.length?Math.round(avg(sn.map(x=>x.sn))):m,sn.length?'Sincerity':'Integrity',76)}<div style="flex:1;min-width:200px"><div class="row sp"><b>Sincerity and integrity</b><span class="chip ${l[1]}">${l[0]}</span></div><div class="mut sm">Integrity ${m} across your last ${Math.min(10,L.length)} monitored session${L.length>1?'s':''}. Open the Integrity tab for detail. Signals, not proof.</div></div></div>`}
function pInteg(){const L=allIg();
 if(!L.length)return`<div class="card"><b>No integrity data yet</b><p class="mut sm">Leave the integrity check ticked on the camera setup screen, then finish an interview answer, test, try-out or game. Signals checked: tab switching, pasting, your face leaving the frame, a second face, looking away, and voices during silent tasks.</p></div>`;
 const last=L.slice(-10),m=Math.round(avg(last.map(x=>x.s))),I=L.filter(x=>x.kind==='Interview'),au=I.filter(x=>x.au!=null),sn=I.filter(x=>x.sn!=null),tot={lost:0,pst:0,nof:0,mul:0,awy:0,typ:0};
 L.forEach(x=>Object.keys(tot).forEach(k=>tot[k]+=x.k[k]||0));
 const S=L.slice(-20),lab=S.map((x,i)=>L.length-S.length+i+1),by={};L.forEach(x=>(by[x.kind]=by[x.kind]||[]).push(x.s));
 const SG=[['lost','Left the tab or window'],['pst','Pasted text'],['nof','Face missing from the frame'],['mul','Second face in the frame'],['awy','Looked away from the screen'],['typ','Typed instead of spoke']];
 return`<div class="grid c4"><div class="card stat rg">${ring(m,'',68)}<span class="mut sm">Integrity (last ${last.length})</span></div><div class="card stat"><b>${au.length?Math.round(avg(au.map(x=>x.au))):'–'}</b><span class="mut sm">Authenticity of wording</span></div><div class="card stat"><b>${sn.length?Math.round(avg(sn.slice(-10).map(x=>x.sn))):'–'}</b><span class="mut sm">Sincerity, interviews</span></div><div class="card stat"><b>${L.filter(x=>x.s<80).length}<small style="font-size:.9rem"> of ${L.length}</small></b><span class="mut sm">Sessions with flags</span></div></div>
 <div class="card"><b>Integrity trend</b>${line([{n:'Integrity',c:'var(--s1)',w:3,v:S.map(x=>x.s)}],lab)}</div>
 <div class="grid c2"><div class="card"><b>Signals raised</b><p class="mut sm">Total across all monitored sessions.</p>${SG.map(([k,l])=>`<div class="row sp vrow"><span>${l}</span><b>${tot[k]}</b></div>`).join('')}</div><div class="card"><b>By activity</b>${Object.entries(by).map(([k,v])=>hb(k,Math.round(avg(v)),v.length+' session'+(v.length>1?'s':''),'')).join('')}</div></div>
 <div class="card"><b>Recent sessions</b>${L.slice(-8).reverse().map(x=>{const l=lvl(x.s),t=kt(x.k,x.kind!=='Interview');return`<div class="vrow"><span class="chip ${l[1]}">${x.s}</span> <b>${esc(x.l)}</b><div class="mut sm">${dt(x.t)} · ${x.kind}${t.length?' · '+t.join(', '):' · no flags'}${x.c==='l'?' · limited check':''}</div></div>`}).join('')}</div>
 <div class="card sm mut"><b>How to read this.</b> Integrity starts at 100 and loses points for each signal. Authenticity rates wording only: first-person actions, names and figures, stock phrases, and overlap with your earlier answers. Sincerity blends them (60% integrity, 40% authenticity) for interviews. None of this proves honesty or cheating. Glancing at notes, a dropped connection or poor lighting can raise flags, and a calm, rehearsed liar can score well. Use it to build honest habits, not as a verdict.${lim(L)}</div>`}
const lim=L=>L.some(x=>x.c==='l')?' Sessions marked limited had no working face tracking (it needs an internet connection to load once).':'';
function pTests(){const T=D.tests;if(!T.length)return'<div class="card">No KPMG tests yet. They are the first KPMG stages.</div>';
 return Object.keys(KT).map(id=>{const h=T.filter(x=>x.id===id);if(!h.length)return`<div class="card"><b>${KT[id].name}</b><p class="mut sm">Not taken yet.</p></div>`;const v=h.map(x=>x.p),c={};h.forEach(x=>Object.entries(x.m.cats||{}).forEach(([k,[a,b]])=>{c[k]=c[k]||[0,0];c[k][0]+=a;c[k][1]+=b}));const m=h[h.length-1].m;
  return`<div class="card"><div class="row sp"><b>${KT[id].name}</b>${spark(v)}</div><div class="mut sm">${h.length} attempt${h.length>1?'s':''} · best ${Math.max(...v)}% · latest ${v[v.length-1]}%</div><div class="mut sm" style="margin-top:8px">Latest: ${m.ok}/${m.n} in ${mmss(m.secs)}, ${Math.round(m.avgMs/1000)}s per question. Accuracy by topic across all attempts:</div>${Object.entries(c).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[a,b]])=>hb(k,Math.round(a/b*100),a+' of '+b)).join('')}</div>`}).join('')}

function pHist(){const items=[...D.ans.filter(a=>flt==='all'||a.co===flt).map(a=>({t:a.t,k:'a',a})),...(flt==='all'||flt==='shell'?D.vjt.map(v=>({t:v.t,k:'v',v})):[]),...(flt==='all'||flt==='bae'?D.games.map(g=>({t:g.t,k:'g',g})):[]),...(flt==='all'||flt==='kpmg'?D.tests.map(x=>({t:x.t,k:'t',x})):[])].sort((a,b)=>b.t-a.t);
 const GN={bart:'Balloon risk',num:'Number reasoning',gng:'Focus and reaction'};
 const rows=items.slice(0,histN).map(it=>{
  if(it.k==='a'){const a=it.a;return`<details class="card"><summary><span class="dotc" style="background:${sc(a.o)}"></span><span style="flex:1"><b>${esc(a.q)}</b><br><span class="mut sm">${dt(a.t)} · ${CO[a.co]?CO[a.co].name:a.co} interview</span></span><b>${a.o}</b></summary><div class="in"><p class="mut sm">Specificity ${a.sp} · Delivery ${a.cf}${a.m?` · ${a.m.w} words${a.m.wpm?' · '+a.m.wpm+' wpm':''}`:''}${a.sn!=null?` · Sincerity ${a.sn}`:''}</p>${a.tx?`<p style="white-space:pre-wrap">${esc(a.tx)}</p>`:'<p class="mut sm">No transcript saved for this older answer.</p>'}${a.fl.length?`<ul>${a.fl.slice(0,3).map(f=>`<li><b>${FL[f][0]}.</b> ${FL[f][1]}</li>`).join('')}</ul>`:''}</div></details>`}
  if(it.k==='v'){const v=it.v;return`<div class="card row sp"><span class="row"><span class="dotc" style="background:${sc(v.p)}"></span><span><b>Virtual Job Try-out</b><br><span class="mut sm">${dt(v.t)}</span></span></span><b>${v.p}%</b></div>`}
  if(it.k==='t'){const x=it.x;return`<div class="card row sp"><span><b>${KT[x.id]?KT[x.id].name:x.id}</b><br><span class="mut sm">${dt(x.t)} · KPMG test${x.ig?' · integrity '+x.ig.s:''}</span></span><span>${x.m.ok}/${x.m.n} · ${x.p}%</span></div>`}
  const g=it.g,m=g.m,s=g.g==='num'?`${m.ok}/${m.n} correct`:g.g==='gng'?`${m.acc}% accuracy · ${m.mrt} ms`:`${m.adj} avg pumps · ${m.pops} popped`;
  return`<div class="card row sp"><span><b>${GN[g.g]||g.g}</b><br><span class="mut sm">${dt(g.t)}</span></span><span>${s}</span></div>`}).join('');
 return`<div class="stack">${rows||'<div class="card">Nothing in this view yet.</div>'}${items.length>histN?'<button class="btn ghost" id="more">Show more</button>':''}</div>
 <div class="card stack"><b>Your data</b><p class="mut sm">Your answers, transcripts and scores are stored in this browser. Video is never saved. If you chose to share your practice answers, a copy of the text answers and scores (never video or audio) is also sent to JobVue.</p><div class="row"><button class="btn ghost sm" id="ej">Download JSON</button><button class="btn ghost sm" id="ec">Download answers CSV</button><button class="btn ghost sm" id="cl">Clear my data</button><button class="btn ghost sm" id="sh2">${D.user&&D.user.share?'Stop sharing my answers':'Share my answers'}</button><button class="btn ghost sm" id="so">Sign out</button></div></div>`}
function dl(name,type,text){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function bindHist(){const m=$('#more');if(m)m.onclick=()=>{histN+=40;dash()};
 $('#ej').onclick=()=>dl('jobvue-data.json','application/json',JSON.stringify(D,null,2));
 $('#ec').onclick=()=>{const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';dl('jobvue-answers.csv','text/csv',['date,company,question,overall,specificity,delivery,words,wpm,flags,integrity,authenticity,sincerity',...D.ans.map(a=>[new Date(a.t).toISOString(),a.co,q(a.q),a.o,a.sp,a.cf,a.m?a.m.w:'',a.m?a.m.wpm:'',q(a.fl.join(' ')),a.ig?a.ig.s:'',a.au==null?'':a.au,a.sn==null?'':a.sn].join(','))].join('\n'))};
 $('#sh2').onclick=()=>{D.user.share=!D.user.share;save();dash()};
 $('#so').onclick=()=>{D.user=null;save();show('home')};
 $('#cl').onclick=async()=>{if(await ask('Delete all saved practice data on this device?','Delete','Keep')){D={ans:[],vjt:[],games:[],tests:[],user:D.user,set:D.set};save();try{localStorage.removeItem('jobvue')}catch(e){}dash()}}}

/* ---- Boot ---- */
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
detect();try{if(!sessionStorage.getItem('jv_v')){sessionStorage.setItem('jv_v','1');track('visit')}}catch(e){track('visit')}
addEventListener('resize',detect);addEventListener('orientationchange',detect);
if(D.user&&!D.user.id){D.user.id=uid();save()}
show('home');pulse();setInterval(ping,3000);setInterval(fetchLive,3000);schedLive();document.addEventListener('visibilitychange',()=>{if(!document.hidden)pulse()});
</script>
</body>
