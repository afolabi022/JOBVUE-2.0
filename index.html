  app.innerHTML=`<section class="stack">${head()}<div class="card"><div class="row sp"><span class="mut">Preparation time</span><span class="big" id="tm">0:30</span></div>${vid()}<div class="row"><button class="btn" id="go">Start answering</button><span class="mut sm"><span class="keyOnly">or press Space</span></span></div></div></section>`;attach();$('#go').onclick=ans;tick(30,ans,upd,[10])}

  app.innerHTML=`<section class="stack">${head()}<div class="card"><div class="row sp"><span class="mut">Answer</span><span class="big" id="tm">2:00</span></div>${vid(true)}<textarea id="tx" aria-label="Transcript" placeholder="${SR?'Your words appear here as you speak. You can edit them before finishing.':'Live transcription is not available in this browser. Type your key points here (optional); scores use only what is written.'}"></textarea><p class="mut sm" id="nt" role="status"></p><button class="btn" id="fin" style="margin-top:10px">Finish answer</button></div></section>`;attach();
  if(SR){try{sr=new SR();sr.continuous=true;sr.interimResults=false;sr.lang=D.set.lang;want=true;
   sr.onresult=e=>{let s='';for(let k=e.resultIndex;k<e.results.length;k++)if(e.results[k].isFinal)s+=e.results[k][0].transcript+' ';if(s){sp=true;sw+=s.trim().split(/\s+/).length;const t=$('#tx');if(t)t.value+=(t.value&&!/\s$/.test(t.value)?' ':'')+s}};
   sr.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;const n=$('#nt');if(n)n.textContent='Speech recognition was blocked, so type your key points instead.'}};

  $('#fin').onclick=fin;tick(120,fin,upd,[30,10])}

  app.innerHTML=`<section class="stack"><h1>Interview done</h1>${sessionScores.length?`<div class="card row">${ring(s,'Session avg',110)}<p style="flex:1;min-width:200px">${sessionScores.length} answer${sessionScores.length>1?'s':''} saved. Open the dashboard to see which habits to fix first.</p></div>`:'<div class="card">No answers were saved this time.</div>'}<div class="row"><button class="btn" id="s">Next stage</button><button class="btn ghost" id="d">Dashboard</button></div></section>`;$('#s').onclick=nextStage;$('#d').onclick=()=>show('dash')}

/* Balloon risk (BART): burst point uniform 1-24, 5 points per pump. Expected-value optimum is 12 pumps. */
function gBart(){const me=++alive;cleanup();start();pip(true);const N=10,MAX=24,PTS=5,OPT=12;let n=0,bank=0,pumps=0,burst=R(1,MAX),log=[],lock=false;
 app.innerHTML=`<section class="stack"><div class="meta row sp"><span id="bn"></span><span>Banked <b id="bb">0</b></span></div>${barp(0)}<div class="card ctr"><div class="stagebox"><svg id="bl" width="260" height="240" viewBox="0 0 260 240" aria-hidden="true"><ellipse id="be" cx="130" cy="105" rx="40" ry="46" fill="var(--ac)"/><path d="M130 151 l-8 14 h16z" fill="var(--ac)"/><path d="M130 165 q-6 30 4 64" stroke="var(--mut)" fill="none" stroke-width="2"/></svg></div><div class="big" id="bp">0</div><p class="mut" id="bm">points on this balloon</p><div class="row ctr"><button class="btn" id="pu">Pump +${PTS} <span class="kb">(Space)</span></button><button class="btn ghost" id="bk" disabled>Bank it <span class="kb">(Enter)</span></button></div></div><p class="mut sm ctr">The burst point is random for each balloon. A popped balloon scores 0.</p></section>`;
 const paint=m=>{$('#bn').textContent=`Balloon ${Math.min(n+1,N)} of ${N}`;$('.bar i').style.width=n/N*100+'%';$('#bb').textContent=bank;$('#bp').textContent=pumps*PTS;$('#bm').textContent=m||'points on this balloon';$('#bl').style.transform=`scale(${(.45+pumps*.065).toFixed(3)})`;$('#bk').disabled=lock||!pumps;$('#pu').disabled=lock};
 const nextB=()=>{n++;if(n>=N)return fin();pumps=0;burst=R(1,MAX);lock=false;$('#be').setAttribute('fill','var(--ac)');paint()};
 const pump=()=>{if(me!==alive||lock)return;pumps++;if(pumps>=burst){lock=true;log.push({p:pumps,pop:true});$('#be').setAttribute('fill','var(--bad)');$('#bl').style.transform='scale(1.5)';say('Popped');paint('Popped! This balloon scores 0.');setTimeout(()=>{if(me===alive)nextB()},1100)}else paint()};
 const bankIt=()=>{if(me!==alive||lock||!pumps)return;bank+=pumps*PTS;log.push({p:pumps,pop:false});say('Banked');lock=true;paint(`Banked ${pumps*PTS}`);setTimeout(()=>{if(me===alive)nextB()},600)};
 $('#pu').onclick=pump;$('#bk').onclick=bankIt;keys(e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();pump()}else if(e.key==='Enter'||e.key==='b'){bankIt()}});
 function fin(){const safe=log.filter(l=>!l.pop),adj=safe.length?avg(safe.map(l=>l.p)):0,pops=log.length-safe.length;gSave('bart',{bank,pops,adj:Math.round(adj*10)/10,pumps:log.map(l=>l.p),pop:log.map(l=>l.pop?1:0)});
  const note=!safe.length?'Every balloon popped. Nothing was banked, so next time try banking earlier.':adj<7?'Cautious: you banked early, which is safe but leaves points on the table.':adj<10?'Slightly cautious: close to the best balance.':adj<=14?'Close to the statistical optimum. Well balanced.':'Risk-seeking: you pushed past the best balance and lost points to pops.';
  gRes('Balloon risk',[['Points banked',bank],['Popped',pops+' of '+N],['Avg pumps (unpopped)',safe.length?adj.toFixed(1):'–'],['Best balance',OPT+' pumps']],`${note}<p class="mut sm">Each balloon bursts at a random pump from 1 to ${MAX}, so expected points peak at about ${OPT} pumps. The average is taken over balloons you banked, the standard way this task is measured. There is no single right score; employers look for a deliberate, consistent approach.</p>`,
   `<div class="card"><b>Pumps per balloon</b><div class="act" style="margin-top:10px">${log.map((l,i)=>`<div data-tip="Balloon ${i+1}: ${l.p} pumps${l.pop?' (popped)':''}"><i style="height:${l.p/MAX*100}%;background:${l.pop?'var(--bad)':'var(--ok)'}"></i><small>${i+1}</small></div>`).join('')}</div><p class="mut sm" id="tip2">Green = banked, red = popped.</p></div>`,gBart)}
 paint()}

/* Numerical reasoning: 8 generated questions, 8 minutes, no feedback until the end */
function gNum(){const me=++alive;cleanup();start();pip(true);const qs=shf(GEN).slice(0,8).map(g=>g()),TL=480;let i=0,ans=[],q0=0,done=false;const T0=performance.now(),end=T0+TL*1000,left=()=>Math.max(0,Math.ceil((end-performance.now())/1000));
 const rec=(pk,skip)=>{const q=qs[i];ans.push({t:q.t,ok:!skip&&pk===q.ans,skip:!!skip,pick:skip?'—':pk,ms:performance.now()-q0});i++;one()};
 function one(){if(i>=qs.length)return fin();const q=qs[i];q0=performance.now();
  app.innerHTML=`<section class="stack"><div class="meta row sp"><span>Question ${i+1} of ${qs.length} · ${q.t}</span><span class="chip">⏱ <span id="tm">${mmss(left())}</span></span></div>${barp(i/qs.length)}<div class="card"><h2 class="q" style="margin:0">${q.q}</h2>${q.tbl?tblh(q.tbl):''}</div>${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span>${o}</span></button>`).join('')}<div class="row"><button class="btn ghost" id="sk">Skip</button></div></section>`;
  $$('.opt').forEach(b=>b.onclick=()=>rec(q.o[+b.dataset.k]));$('#sk').onclick=()=>rec(null,true)}
 keys(e=>{if(/^[1-4]$/.test(e.key)&&!done&&qs[i]&&qs[i].o[+e.key-1]!==undefined)rec(qs[i].o[+e.key-1])});
 function fin(){if(done)return;done=true;stop();while(ans.length<qs.length){ans.push({t:qs[ans.length].t,ok:false,skip:true,pick:'—',ms:0})}
  const ok=ans.filter(a=>a.ok).length,secs=Math.round((performance.now()-T0)/1000),cats={};ans.forEach(a=>{cats[a.t]=cats[a.t]||[0,0];cats[a.t][1]++;if(a.ok)cats[a.t][0]++});
  const timed=ans.filter(a=>a.ms>0);gSave('num',{ok,n:qs.length,secs:Math.min(secs,TL),avgMs:Math.round(avg(timed.map(a=>a.ms))),cats});
  gRes('Number and data reasoning',[['Correct',ok+' / '+qs.length],['Time used',mmss(Math.min(secs,TL))],['Avg per question',Math.round(avg(timed.map(a=>a.ms))/1000)+'s'],['Skipped',ans.filter(a=>a.skip).length]],ok>=7?'Strong numerical reasoning.':ok>=5?'Solid. Check the questions you missed in the review below.':'Revise percentage change, ratios, series differences and averages, then try again.',
   `<div class="stack"><b>Review</b>${qs.map((q,j)=>`<details class="card"><summary><span class="dotc" style="background:${ans[j].ok?'var(--ok)':ans[j].skip?'var(--mid)':'var(--bad)'}"></span><span style="flex:1">${q.q}</span></summary><div class="in">${q.tbl?tblh(q.tbl):''}<p><b>Your answer:</b> ${ans[j].pick} · <b>Correct:</b> ${q.ans}</p><p class="mut">${q.why}</p></div></details>`).join('')}</div>`,gNum)}
 tick(TL,fin,upd,[60,10]);one()}

/* Go / no-go: 75% go, stimulus 800 ms, random 500-1000 ms gap, responses under 150 ms treated as anticipatory */
function gGng(){const me=++alive;cleanup();pip(true);busy=false;
 const how=dev.type==='laptop'||dev.type==='tablet'&&false?'press Space or click':'tap';
 app.innerHTML=`<section class="stack"><h1>Focus and reaction</h1><div class="card stack"><div class="row"><div class="stim go sm">✓</div><p style="margin:0">Green circle: <b>${how}</b> as fast as you can.</p></div><div class="row"><div class="stim no sm">✕</div><p style="margin:0">Red square: <b>do nothing</b>.</p></div><p class="mut sm">6 practice trials with feedback, then 40 scored trials (about 90 seconds). Shapes differ as well as colours. Speed matters, but so does not tapping on red.</p><button class="btn" id="go">Start practice</button></div></section>`;
 $('#go').onclick=()=>run(true);
 function run(prac){start();pip(true);const list=prac?shf([1,1,1,1,0,0]):shf([...Array(30).fill(1),...Array(10).fill(0)]);let idx=0,on=false,t0=0,cur=null,res=[],early=0,timers=[];
  app.innerHTML=`<section class="stack"><div class="meta row sp"><span>${prac?'Practice':'Test'}</span><span id="cnt"></span></div>${barp(0)}<div class="arena" id="ar" role="button" tabindex="0" aria-label="Response area"><div id="st"></div></div><p class="mut ctr sm" id="fbk">&nbsp;</p></section>`;
  const T=(f,ms)=>timers.push(setTimeout(()=>{if(me===alive)f()},ms));onClean(()=>timers.forEach(clearTimeout));
  const respond=()=>{if(!on){early++;return}if(cur.resp)return;cur.resp=true;cur.rt=performance.now()-t0;$('#st').innerHTML=''};
  $('#ar').addEventListener('pointerdown',e=>{e.preventDefault();respond()});keys(e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();respond()}});
  const msg=c=>c.go?(c.resp?'Good':'Too slow. Respond to green circles.'):(c.resp?'That was a red square. Hold back.':'Correct: you held back.');
  const nextT=()=>{if(idx>=list.length)return finT();$('#cnt').textContent=(idx+1)+' / '+list.length;$('.bar i').style.width=idx/list.length*100+'%';const go=list[idx++];cur={go:!!go,resp:false,rt:null};$('#fbk').innerHTML='&nbsp;';
   T(()=>{$('#st').innerHTML=go?'<div class="stim go">✓</div>':'<div class="stim no">✕</div>';on=true;requestAnimationFrame(()=>{t0=performance.now()});T(()=>{on=false;$('#st').innerHTML='';res.push(cur);if(prac)$('#fbk').textContent=msg(cur);T(nextT,prac?1000:R(500,1000))},800)},R(500,900))};
  function finT(){if(prac){busy=false;app.innerHTML=`<section class="stack"><h1>Practice done</h1><div class="card stack"><p>Ready for the scored round? 40 trials, no feedback until the end.</p><button class="btn" id="st2">Start test</button></div></section>`;$('#st2').onclick=()=>run(false);return}
   const gos=res.filter(r=>r.go),ngs=res.filter(r=>!r.go),hits=gos.filter(r=>r.resp),om=gos.length-hits.length,ce=ngs.filter(r=>r.resp).length,ant=hits.filter(r=>r.rt<150).length,rts=hits.filter(r=>r.rt>=150).map(r=>r.rt),
    acc=Math.round((hits.length+ngs.length-ce)/res.length*100),mrt=Math.round(avg(rts)),srt=Math.round(sd(rts));
   gSave('gng',{acc,mrt,srt,ce,om,ant,early,go:gos.length,ng:ngs.length});
   const note=ce/ngs.length>.3?'Many taps on red squares: slow down slightly and look before you respond.':om/gos.length>.2?'You missed several green circles: keep your eyes on the centre and stay ready.':'Accurate and controlled.';
   gRes('Focus and reaction',[['Accuracy',acc+'%'],['Mean reaction',mrt+' ms'],['Consistency (SD)',srt+' ms'],['Wrong taps on red',ce+' of '+ngs.length],['Missed greens',om+' of '+gos.length],['Too-early taps',ant+early]],`${note}<p class="mut sm">Reaction time is measured for correct taps only, ignoring any under 150 ms as anticipation. A lower SD means steadier attention. Fast and accurate matters more than fastest.</p>`,'',gGng)}
  nextT()}}

/* ================= Dashboard ================= */
const TABS=[['overview','Overview'],['interviews','Interviews'],['tryout','Try-out'],['games','Games'],['history','History']];
const HAB=[['num','Uses numbers and evidence'],['own','Shows personal ownership'],['res','States the result'],['ref','Reflects and learns'],['rel','Answers the question'],['val','Shows company values'],['fill','Few filler words'],['hed','Direct language'],['pace','Pace on target'],['short','Full-length answers']];
const fa=()=>flt==='all'?D.ans:D.ans.filter(a=>a.co===flt);
const scored=A=>A.filter(a=>a.o>0);
function habits(A){const S=scored(A);return HAB.map(([f,l])=>{let pool=S;if(f==='pace')pool=S.filter(a=>(a.m&&a.m.spoken)||a.fl.includes('pace'));if(!pool.length)return{f,l,rate:null,n:0};return{f,l,rate:Math.round(pool.filter(a=>!a.fl.includes(f)).length/pool.length*100),n:pool.length}})}
function delta(A){const S=scored(A);if(S.length<6)return 0;const l=S.slice(-5),p=S.slice(-10,-5);return avg(l.map(a=>a.o))-avg(p.map(a=>a.o))}
function insight(A){const S=scored(A);if(!S.length)return'Record one interview answer to unlock personal insights.';const h=habits(A).filter(x=>x.rate!=null).sort((a,b)=>a.rate-b.rate),w=h[0],s=h[h.length-1],d=delta(A);
 return(d>3?`Trending up: +${Math.round(d)} points over your last five answers. `:d<-3?`Your last five answers dipped ${Math.round(-d)} points. `:'')+`Strongest habit: ${s.l.toLowerCase()} (${s.rate}%). Biggest opportunity: ${w.l.toLowerCase()} (${w.rate}%).`}
function gScores(){const o=[],L=g=>[...D.games].reverse().find(x=>x.g===g);const n=L('num'),f=L('gng'),b=L('bart');if(n)o.push(n.m.ok/n.m.n*100);if(f)o.push(f.m.acc);if(b&&b.m.adj>0)o.push(Math.max(0,100-Math.min(100,Math.abs(b.m.adj-12)/12*100)));return o}
function pIndex(){const P=[],A=scored(D.ans);if(A.length)P.push([avg(A.slice(-10).map(a=>a.o)),.5]);const v=D.vjt.slice(-3);if(v.length)P.push([avg(v.map(x=>x.p)),.2]);const g=gScores();if(g.length)P.push([avg(g),.3]);const w=P.reduce((s,p)=>s+p[1],0);return w?Math.round(P.reduce((s,p)=>s+p[0]*p[1],0)/w):null}
function streak(){const s=new Set([...D.ans,...D.vjt,...D.games].map(x=>dk(x.t)));const d=new Date();let n=0;if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}return{n,days:s.size}}
function line(sr,lab){const W=640,H=210,L=30,Rr=12,Tp=12,B=24,n=lab.length;if(n<2)return'<p class="mut sm">Practise at least two answers to see a trend.</p>';const x=i=>L+(W-L-Rr)*i/(n-1),y=v=>Tp+(H-Tp-B)*(1-v/100);let g='';
 [0,25,50,75,100].forEach(v=>g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
 const xl=lab.map((l,i)=>(n<=10||i%Math.ceil(n/10)===0||i===n-1)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`:'').join('');
 const ps=sr.map(s=>`<path d="${s.v.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`+s.v.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${s.w>2?4.5:3}" fill="${s.c}" stroke="transparent" stroke-width="14" data-tip="${s.n}, answer ${lab[i]}: ${v}" tabindex="0"/>`).join('')).join('');
 return`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Score trend">${g}${xl}${ps}</svg>`}
const spark=(v,c='var(--ac)')=>{if(v.length<2)return'';const W=120,H=34,x=i=>2+(W-4)*i/(v.length-1),mn=Math.min(...v),mx=Math.max(...v),y=a=>H-3-(H-6)*((a-mn)/((mx-mn)||1));return`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${v.map((a,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(a).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`};
function activity(){const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d.getTime())}const all=[...D.ans,...D.vjt,...D.games].map(x=>x.t),cnt=days.map(s=>all.filter(t=>t>=s&&t<s+864e5).length),mx=Math.max(1,...cnt);
 return`<div class="act">${cnt.map((c,i)=>`<div data-tip="${new Date(days[i]).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}: ${c} session${c===1?'':'s'}" tabindex="0"><i style="height:${Math.max(c?12:3,c/mx*100)}%;${c?'':'opacity:.3'}"></i><small>${new Date(days[i]).toLocaleDateString([], {weekday:'narrow'})}</small></div>`).join('')}</div>`}
const gauge=(v,lo,hi,a,b)=>{const p=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));return`<div class="gauge"><i class="band" style="left:${p(a)}%;width:${p(b)-p(a)}%"></i><b class="mk" style="left:${p(v)}%"></b></div>`};

function dash(){
 if(!D.ans.length&&!D.vjt.length&&!D.games.length){app.innerHTML=`<section class="stack"><h1>Dashboard</h1><div class="card ctr"><p><b>Nothing here yet.</b></p><p class="mut">Finish an interview answer, a try-out or a game and your scores, trends and weak spots appear here.</p><button class="btn" id="st">Start practising</button></div></section>`;$('#st').onclick=()=>show('home');return}
 app.innerHTML=`<section class="stack"><div class="row sp"><h1 style="margin:0">Dashboard</h1><div class="seg" id="flt" role="group" aria-label="Company filter">${[['all','All'],['shell','Shell'],['bae','BAE']].map(([k,l])=>`<button data-f="${k}" class="${flt===k?'on':''}">${l}</button>`).join('')}</div></div><div class="seg" id="tabs" role="group" aria-label="Sections">${TABS.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="pane" class="stack"></div><p id="tip" class="tip" role="status">Tap or hover a point or bar for details.</p></section>`;
 $$('#flt button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;dash()});$$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;dash()});
 $('#pane').innerHTML=({overview:pOver,interviews:pInt,tryout:pTry,games:pGames,history:pHist})[tab]();
 if(tab==='history')bindHist()}
app.addEventListener('click',e=>{const t=e.target.closest('[data-tip]'),el=$('#tip')||$('#tip2');if(t&&el)el.textContent=t.dataset.tip});
app.addEventListener('pointerover',e=>{const t=e.target.closest('[data-tip]'),el=$('#tip')||$('#tip2');if(t&&el&&e.pointerType==='mouse')el.textContent=t.dataset.tip});

function pOver(){const A=scored(fa()),ix=pIndex(),st=streak(),secs=Math.round(D.ans.reduce((s,a)=>s+((a.m&&a.m.secs)||0),0)/60),d=delta(A),S=A.slice(-20),lab=S.map((a,i)=>A.length-S.length+i+1);
 const cnt={};A.forEach(a=>a.fl.forEach(f=>cnt[f]=(cnt[f]||0)+1));const top=Object.entries(cnt).sort((a,b)=>b[1]*FL[b[0]][2]-a[1]*FL[a[0]][2]).slice(0,3),l5=A.slice(-5);
 const str=habits(fa()).filter(h=>h.rate!=null&&h.rate>=70).sort((a,b)=>b.rate-a.rate).slice(0,3);
 return`<div class="card tint"><b>${insight(fa())}</b></div>
 <div class="grid c4"><div class="card stat">${ix==null?'<b>–</b>':ring(ix,'',84)}<span class="mut sm" style="margin-top:6px">Practice index</span></div><div class="card stat"><b>${A.length?Math.round(avg(A.slice(-10).map(a=>a.o))):'–'}${d?`<small style="font-size:.9rem;color:${d>0?'var(--ok)':'var(--bad)'}"> ${d>0?'▲':'▼'}${Math.abs(Math.round(d))}</small>`:''}</b><span class="mut sm">Avg overall (last 10)</span></div><div class="card stat"><b>${A.length}</b><span class="mut sm">Answers practised</span></div><div class="card stat"><b>${st.n}<small style="font-size:.9rem"> day${st.n===1?'':'s'}</small></b><span class="mut sm">Streak · ${st.days} practice days</span></div></div>
 <p class="mut sm" style="margin:-6px 0 0">Practice index blends your last 10 answers (50%), last 3 try-outs (20%) and latest game results (30%), using whichever you have. It is a guide for you, not an employer score.</p>
 <div class="card"><div class="row sp"><b>Score trend</b><div class="legend"><span><i style="background:var(--s1)"></i>Overall</span><span><i style="background:var(--s2)"></i>Specificity</span><span><i style="background:var(--s3)"></i>Delivery</span></div></div>${line([{n:'Overall',c:'var(--s1)',w:3,v:S.map(a=>a.o)},{n:'Specificity',c:'var(--s2)',v:S.map(a=>a.sp)},{n:'Delivery',c:'var(--s3)',v:S.map(a=>a.cf)}],lab)}</div>
 <div class="grid c2"><div class="card"><b>Fix these first</b>${top.length?top.map(([f,n])=>{const k5=l5.filter(a=>a.fl.includes(f)).length;return`<div class="vrow"><span class="chip no">${n} of ${A.length} answers</span> <b>${FL[f][0]}</b><div class="mut sm">${FL[f][1]}${l5.length>=3?` In your last ${l5.length}: ${k5}.`:''}</div></div>`}).join(''):'<p class="mut">No repeated weak spots yet. Nice.</p>'}</div>
 <div class="card"><b>Working well</b>${str.length?str.map(h=>hb(h.l,h.rate)).join(''):'<p class="mut">Keep practising: strengths show once a habit lands in 70% of your answers.</p>'}</div></div>
 <div class="card"><b>Practice in the last 14 days</b><div style="margin-top:10px">${activity()}</div></div>`}

function pInt(){const A=scored(fa());if(!A.length)return'<div class="card">No interview answers yet for this filter.</div>';
 const H=habits(fa()),sp=A.filter(a=>a.m&&a.m.wpm),wpm=sp.length?Math.round(avg(sp.map(a=>a.m.wpm))):null,withM=A.filter(a=>a.m),fill=withM.length?avg(withM.map(a=>a.m.w?a.m.fill/a.m.w*100:0)):null,words=withM.length?Math.round(avg(withM.map(a=>a.m.w))):null;
 const byQ={};A.forEach(a=>(byQ[a.q]=byQ[a.q]||[]).push(a));const rows=Object.entries(byQ).map(([q,l])=>({q,n:l.length,a:Math.round(avg(l.map(x=>x.o))),b:Math.max(...l.map(x=>x.o)),ch:l.length>1?l[l.length-1].o-l[0].o:null,co:l[0].co})).sort((a,b)=>a.a-b.a).slice(0,10);
 const comp=Object.keys(CO).map(k=>{const s=scored(D.ans).filter(a=>a.co===k);return s.length?{k,n:s.length,o:Math.round(avg(s.map(a=>a.o))),s:Math.round(avg(s.map(a=>a.sp))),c:Math.round(avg(s.map(a=>a.cf)))}:null}).filter(Boolean);
 return`<div class="grid c2"><div class="card"><b>Skill breakdown</b><p class="mut sm">Share of answers where the habit showed up.</p>${H.map(h=>hb(h.l,h.rate,h.f==='pace'&&h.rate==null?'Needs spoken answers':'')).join('')}</div>
 <div class="stack"><div class="card"><b>Delivery</b>${wpm!=null?`<div class="row sp" style="margin-top:8px"><span>Pace</span><b>${wpm} wpm</b></div>${gauge(wpm,60,220,120,160)}<div class="mut sm">Green band = 120 to 160 words a minute.</div>`:'<p class="mut sm">Pace needs spoken answers with live transcription.</p>'}${fill!=null?`<div class="row sp" style="margin-top:12px"><span>Filler words</span><b>${fill.toFixed(1)} per 100 words</b></div>${gauge(fill,0,8,0,2)}<div class="mut sm">Aim for under 2.</div>`:''}${words!=null?`<div class="row sp" style="margin-top:12px"><span>Average length</span><b>${words} words</b></div>`:''}</div>
 ${flt==='all'&&comp.length>1?`<div class="card"><b>Company comparison</b>${comp.map(c=>`<div class="vrow"><b>${CO[c.k].name}</b> <span class="mut sm">${c.n} answers</span>${hb('Overall',c.o)}</div>`).join('')}</div>`:''}</div></div>
 <div class="grid c2">${Object.keys(CO).filter(k=>flt==='all'||flt===k).map(k=>{const s=A.filter(a=>a.co===k);if(!s.length)return'';return`<div class="card"><b>${CO[k].name} values</b><p class="mut sm">Share of answers where each value showed up.</p>${CO[k].vals.map(v=>hb(v[0],Math.round(s.filter(a=>a.v&&a.v[v[0]]).length/s.length*100))).join('')}</div>`}).join('')}</div>
 <div class="card"><b>Questions, weakest first</b>${rows.map(r=>`<div class="hb"><div class="row sp"><span>${esc(r.q)}</span><b>${r.a}</b></div><div class="track"><i style="width:${r.a}%;background:${sc(r.a)}"></i></div><div class="mut sm">${r.n} attempt${r.n>1?'s':''} · best ${r.b}${r.ch!=null?` · ${r.ch>=0?'up':'down'} ${Math.abs(r.ch)} since first`:''}</div></div>`).join('')}</div>`}

function pTry(){const V2=D.vjt;if(!V2.length)return'<div class="card">No try-out yet. The Virtual Job Try-out is in the Shell stages.</div>';
 const last=V2[V2.length-1],cats={};V2.forEach(v=>Object.entries(v.cats||{}).forEach(([c,x])=>(cats[c]=cats[c]||[]).push(x)));const rows=Object.entries(cats).map(([c,l])=>[c,Math.round(avg(l)*100),l.length]).sort((a,b)=>a[1]-b[1]);
 return`<div class="grid c2"><div class="card row">${ring(last.p,'Latest',120)}<div><b>${V2.length} attempt${V2.length>1?'s':''}</b><div class="mut sm">Best ${Math.max(...V2.map(v=>v.p))}%</div>${spark(V2.map(v=>v.p))}</div></div><div class="card"><b>By scenario type</b>${rows.length?rows.map(r=>hb(r[0],r[1],r[1]<100?CAT_TIPS[r[0]]||'':'')).join(''):'<p class="mut sm">Category detail appears from your next attempt.</p>'}</div></div>`}

function pGames(){const out=[],G=g=>D.games.filter(x=>x.g===g);
 const card=(title,id,prim,body)=>{const h=G(id);if(!h.length)return`<div class="card"><b>${title}</b><p class="mut sm">Not played yet.</p></div>`;const v=h.map(prim);return`<div class="card"><div class="row sp"><b>${title}</b>${spark(v)}</div><div class="mut sm">${h.length} play${h.length>1?'s':''} · best ${Math.max(...v)} · latest ${v[v.length-1]}</div>${body(h)}</div>`};
 out.push(card('Balloon risk','bart',x=>Math.round(Math.max(0,100-Math.min(100,Math.abs(x.m.adj-12)/12*100))),h=>{const m=h[h.length-1].m;return`<div class="row sp" style="margin-top:10px"><span>Avg pumps (unpopped)</span><b>${m.adj}</b></div>${gauge(m.adj,0,24,10,14)}<div class="mut sm">Green band = near the best balance (about 12). ${m.pops} popped, ${m.bank} points banked. Score = closeness to the optimum.</div>`}));
 out.push(card('Number and data reasoning','num',x=>Math.round(x.m.ok/x.m.n*100),h=>{const c={};h.forEach(x=>Object.entries(x.m.cats||{}).forEach(([k,[a,b]])=>{c[k]=c[k]||[0,0];c[k][0]+=a;c[k][1]+=b}));const m=h[h.length-1].m;return`<div class="mut sm" style="margin-top:8px">Latest: ${m.ok}/${m.n} in ${mmss(m.secs)}, ${Math.round(m.avgMs/1000)}s per question. Accuracy by topic across all plays:</div>${Object.entries(c).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[a,b]])=>hb(k,Math.round(a/b*100),a+' of '+b)).join('')}`}));
 out.push(card('Focus and reaction','gng',x=>x.m.acc,h=>{const m=h[h.length-1].m;return`<div class="grid c4" style="margin-top:10px"><div><b>${m.mrt} ms</b><div class="mut sm">Mean reaction</div></div><div><b>${m.srt} ms</b><div class="mut sm">Consistency (SD)</div></div><div><b>${m.ce}/${m.ng}</b><div class="mut sm">Wrong taps on red</div></div><div><b>${m.om}/${m.go}</b><div class="mut sm">Missed greens</div></div></div>`}));
 return out.join('')}

function pHist(){const items=[...D.ans.filter(a=>flt==='all'||a.co===flt).map(a=>({t:a.t,k:'a',a})),...(flt==='bae'?[]:D.vjt.map(v=>({t:v.t,k:'v',v}))),...(flt==='shell'?[]:D.games.map(g=>({t:g.t,k:'g',g})))].sort((a,b)=>b.t-a.t);
 const GN={bart:'Balloon risk',num:'Number reasoning',gng:'Focus and reaction'};
 const rows=items.slice(0,histN).map(it=>{
  if(it.k==='a'){const a=it.a;return`<details class="card"><summary><span class="dotc" style="background:${sc(a.o)}"></span><span style="flex:1"><b>${esc(a.q)}</b><br><span class="mut sm">${dt(a.t)} · ${CO[a.co]?CO[a.co].name:a.co} interview</span></span><b>${a.o}</b></summary><div class="in"><p class="mut sm">Specificity ${a.sp} · Delivery ${a.cf}${a.m?` · ${a.m.w} words${a.m.wpm?' · '+a.m.wpm+' wpm':''}`:''}</p>${a.tx?`<p style="white-space:pre-wrap">${esc(a.tx)}</p>`:'<p class="mut sm">No transcript saved for this older answer.</p>'}${a.fl.length?`<ul>${a.fl.slice(0,3).map(f=>`<li><b>${FL[f][0]}.</b> ${FL[f][1]}</li>`).join('')}</ul>`:''}</div></details>`}
  if(it.k==='v'){const v=it.v;return`<div class="card row sp"><span class="row"><span class="dotc" style="background:${sc(v.p)}"></span><span><b>Virtual Job Try-out</b><br><span class="mut sm">${dt(v.t)}</span></span></span><b>${v.p}%</b></div>`}
  const g=it.g,m=g.m,s=g.g==='num'?`${m.ok}/${m.n} correct`:g.g==='gng'?`${m.acc}% accuracy · ${m.mrt} ms`:`${m.adj} avg pumps · ${m.pops} popped`;
  return`<div class="card row sp"><span><b>${GN[g.g]||g.g}</b><br><span class="mut sm">${dt(g.t)}</span></span><span>${s}</span></div>`}).join('');
 return`<div class="stack">${rows||'<div class="card">Nothing in this view yet.</div>'}${items.length>histN?'<button class="btn ghost" id="more">Show more</button>':''}</div>
 <div class="card stack"><b>Your data</b><p class="mut sm">Everything is stored only in this browser, including transcripts. Video is never saved.</p><div class="row"><button class="btn ghost sm" id="ej">Download JSON</button><button class="btn ghost sm" id="ec">Download answers CSV</button><button class="btn ghost sm" id="cl">Clear my data</button></div></div>`}
function dl(name,type,text){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function bindHist(){const m=$('#more');if(m)m.onclick=()=>{histN+=40;dash()};
 $('#ej').onclick=()=>dl('jobvue-data.json','application/json',JSON.stringify(D,null,2));
 $('#ec').onclick=()=>{const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';dl('jobvue-answers.csv','text/csv',['date,company,question,overall,specificity,delivery,words,wpm,flags',...D.ans.map(a=>[new Date(a.t).toISOString(),a.co,q(a.q),a.o,a.sp,a.cf,a.m?a.m.w:'',a.m?a.m.wpm:'',q(a.fl.join(' '))].join(','))].join('\n'))};
 $('#cl').onclick=async()=>{if(await ask('Delete all saved practice data on this device?','Delete','Keep')){D={ans:[],vjt:[],games:[],set:D.set};save();try{localStorage.removeItem('jobvue')}catch(e){}dash()}}}

/* ---- Boot ---- */
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
detect();addEventListener('resize',detect);addEventListener('orientationchange',detect);
show('home');
</script>
