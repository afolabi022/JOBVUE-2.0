["L", "Testifying before the Senate committee investigating charges that cigarette manufacturers had manipulated nicotine levels in cigarettes in order to addict consumers to their products, tobacco executives argued that cigarette smoking is not addictive. The primary reason they gave in support of this claim was that cigarette smoking was not regulated by the Federal Drug Administration.", "For the tobacco executives' argument to be logically correct, which of the following must be assumed?", ["Substances that are not addictive are not regulated by the Federal Drug Administration.", "The tobacco executives lied when they claimed that cigarette smoking was not addictive.", "Some addictive substances are not regulated by the Federal Drug Administration.", "There is no scientific proof that cigarette smoking is addictive.", "Substances that are not regulated by the Federal Drug Administration are not addictive."], "Substances that are not regulated by the Federal Drug Administration are not addictive.", "The argument goes: not regulated, therefore not addictive. That only works if everything unregulated is non-addictive."],
["L", "People should be held accountable for their own behavior, and if holding people accountable for their own behavior entails capital punishment, then so be it. However, no person should be held accountable for behavior over which he or she had no control.", "Which of the following is the most logical conclusion of the argument above?", ["People should not be held accountable for the behavior of other people.", "People have control over their own behavior.", "People cannot control the behavior of other people.", "Behavior that cannot be controlled should not be punished.", "People have control over behavior that is subject to capital punishment."], "People have control over their own behavior.", "People are accountable for their own behavior, and nobody is accountable for behavior they cannot control. Both can only hold if people control their own behavior."],
["L", "There is clear evidence that the mandated use of safety seats by children under age four has resulted in fewer child fatalities over the past five years. Compared to the five-year period prior to the passage of laws requiring the use of safety seats, fatalities of children under age four have decreased by 30 percent.", "Which one of the following, if true, most substantially strengthens the argument above?", ["The number of serious automobile accidents involving children under age four has remained steady over the past five years.", "Automobile accidents involving children have decreased sharply over the past five years.", "The use of air bags in automobiles has increased by 30 percent over the past five years.", "Most fatal automobile accidents involving children under age four occur in the driveway of their home.", "The number of teenage drivers has increased by 30 percent over the past five years."], "The number of serious automobile accidents involving children under age four has remained steady over the past five years.", "If accidents stayed the same but deaths fell, the safety seats are the likely reason. Fewer accidents or more air bags would be other explanations."],
["L", "Lycopene, glutathione, and glutamine are powerful antioxidants that neutralize the free radicals that are produced in the body as a result of routine bodily processes. An excess of these free radicals in your system causes rapid aging because they accelerate the rate of cellular damage. Aging is simply the result of this damage. Thus, to slow down aging it is necessary to supplement your diet with these antioxidants on a daily basis.", "Which of the following, if true, most seriously undermines the author's contention?", ["Most persons aren't concerned with the effects of aging until it is too late to do anything.", "Exercise associated with normal daily activities effectively neutralizes and dissipates the free radicals that are produced as a result of routine bodily processes.", "The cost of antioxidants is exorbitantly high and well beyond the budget of most consumers.", "Only overweight people who do not exercise on a daily basis are likely to have an excess of free radicals in their systems.", "Smoking cigarettes is one of the main causes of cellular damage in humans."], "Exercise associated with normal daily activities effectively neutralizes and dissipates the free radicals that are produced as a result of routine bodily processes.", "The author says supplements are necessary. If normal daily activity already deals with the free radicals, they are not necessary."],
["L", "Is it wrong for doctors to lie about their patients' illnesses? Aren't doctors just like any other people we hire to do a job for us? Surely, we would not tolerate not being told the truth about the condition of our automobile from the mechanic we hired to fix it, or the condition of our roof from the carpenter we employed to repair it. Just as these workers would be guilty of violating their good faith contracts with us if they were to do this, doctors who lie to their patients about their illnesses violate these contracts as well, and this is clearly wrong.", "The conclusion of the argument is best expressed by which of the following?", ["Doctors who lie to their patients about their illnesses violate their good faith contracts with their patients.", "Doctors often lie to their patients about their illnesses.", "Doctors are just hired workers like mechanics and carpenters.", "It is wrong for doctors to lie about their patients' illnesses.", "Doctors, like mechanics and carpenters, enter into good faith contracts with us when we hire them."], "It is wrong for doctors to lie about their patients' illnesses.", "Everything else is support; the final claim ('this is clearly wrong') answers the opening question. Note: the source sheet marks the third option, but that is only a premise, so it has been corrected here."],
["L", "Six newspapers, The Punch, The Guardian, Vanguard, Daily Telegraph, The Sun and The Mirror, compete for subscriptions in a large city. The following is true about their circulation:\n• The Mirror has more subscribers than any other newspaper.\n• The Guardian has more subscribers than the Punch.\n• Vanguard has more subscribers than at least two other papers.\n• Whenever the Guardian has more subscribers than the Daily Telegraph, the Sun also has more subscribers than the Daily Telegraph.\n• No two newspapers ever have the same number of subscribers.", "Which of the following is a possible listing of the six newspapers in order from fewest subscribers to most?", ["Punch, Vanguard, Daily Telegraph, Guardian, The Sun, The Mirror", "Guardian, The Sun, Daily Telegraph, Punch, Vanguard, The Mirror", "Vanguard, Daily Telegraph, The Sun, Punch, Guardian, The Mirror", "Daily Telegraph, The Sun, Vanguard, Punch, Guardian, The Mirror", "The Sun, Daily Telegraph, Vanguard, Punch, Guardian, The Mirror"], "Daily Telegraph, The Sun, Vanguard, Punch, Guardian, The Mirror", "The first has Vanguard beating only one paper, the second puts Guardian below Punch, the third puts Vanguard last, and the fifth has Guardian above the Telegraph without the Sun also being above it."],
["L", "Six newspapers, The Punch, The Guardian, Vanguard, Daily Telegraph, The Sun and The Mirror, compete for subscriptions in a large city. The following is true about their circulation:\n• The Mirror has more subscribers than any other newspaper.\n• The Guardian has more subscribers than the Punch.\n• Vanguard has more subscribers than at least two other papers.\n• Whenever the Guardian has more subscribers than the Daily Telegraph, the Sun also has more subscribers than the Daily Telegraph.\n• No two newspapers ever have the same number of subscribers.", "Which of the following newspapers could have the fewest subscribers? (I) Daily Telegraph (II) Punch (III) Vanguard (IV) The Sun", ["I and II", "II and III", "I, II and III", "I, III and IV", "I, II and IV"], "I, II and IV", "Vanguard must beat two papers, so it can never be last. The Telegraph, Punch and the Sun can each be last in a valid order (for the Sun, the Telegraph must then be above the Guardian)."],
["L", "Six newspapers, The Punch, The Guardian, Vanguard, Daily Telegraph, The Sun and The Mirror, compete for subscriptions in a large city. The following is true about their circulation:\n• The Mirror has more subscribers than any other newspaper.\n• The Guardian has more subscribers than the Punch.\n• Vanguard has more subscribers than at least two other papers.\n• Whenever the Guardian has more subscribers than the Daily Telegraph, the Sun also has more subscribers than the Daily Telegraph.\n• No two newspapers ever have the same number of subscribers.", "If the Daily Telegraph has more subscribers than The Sun, which of the following must be true?", ["Punch has the fewest subscribers", "Vanguard has more subscribers than exactly three other newspapers", "Daily Telegraph has more subscribers than Guardian", "Daily Telegraph has the second most subscribers", "The Sun has the third most subscribers"], "Daily Telegraph has more subscribers than Guardian", "If the Guardian beat the Telegraph, the Sun would have to beat it too, which contradicts the condition. So the Telegraph must beat the Guardian."],
["L", "Six newspapers, The Punch, The Guardian, Vanguard, Daily Telegraph, The Sun and The Mirror, compete for subscriptions in a large city. The following is true about their circulation:\n• The Mirror has more subscribers than any other newspaper.\n• The Guardian has more subscribers than the Punch.\n• Vanguard has more subscribers than at least two other papers.\n• Whenever the Guardian has more subscribers than the Daily Telegraph, the Sun also has more subscribers than the Daily Telegraph.\n• No two newspapers ever have the same number of subscribers.", "If Punch has the fourth most subscribers, which of the following could be false?", ["The Sun has the fifth most subscriptions", "Daily Telegraph has the fewest subscriptions", "Vanguard has more subscriptions than the Punch", "Guardian has more subscriptions than any paper except the Mirror", "Guardian has more subscriptions than the Sun"], "Guardian has more subscriptions than any paper except the Mirror", "Guardian and Vanguard must take 2nd and 3rd most in some order, the Sun 5th and the Telegraph 6th. Only the order of Guardian and Vanguard is open."],
["L", "Six newspapers, The Punch, The Guardian, Vanguard, Daily Telegraph, The Sun and The Mirror, compete for subscriptions in a large city. The following is true about their circulation:\n• The Mirror has more subscribers than any other newspaper.\n• The Guardian has more subscribers than the Punch.\n• Vanguard has more subscribers than at least two other papers.\n• Whenever the Guardian has more subscribers than the Daily Telegraph, the Sun also has more subscribers than the Daily Telegraph.\n• No two newspapers ever have the same number of subscribers.", "If only two newspapers have lower circulations than the Guardian, all of the following could be true EXCEPT", ["Punch has the fewest subscriptions", "Punch has more subscriptions than The Sun", "Punch has more subscriptions than Vanguard", "Vanguard has fewer subscriptions than Daily Telegraph", "None of the above"], "Punch has more subscriptions than Vanguard", "Guardian is 4th most, so Punch is in the bottom two and Vanguard must be above Guardian. Punch can never beat Vanguard."],
["L", "A secret code uses the numbers 1 to 5. Every code word must meet these rules:\n• A code word has at least three numbers and no more than five.\n• Numbers may repeat unless a rule below says otherwise.\n• Every code word begins with 1.\n• 4 may not be the last number.\n• If 5 is the last number, the word must contain at least one 4.\n• If 2 is the second number, 2 must also be the last number.\n• The number 1 can appear only once.", "Which of the following is a possible code word?", ["1 3 3 2", "1 4 1 4", "1 2 2 3", "4 1 3 5", "1 3 5 5"], "1 3 3 2", "1414 repeats 1 and ends in 4, 1223 has 2 second but not last, 4135 does not start with 1, and 1355 ends in 5 with no 4."],
["L", "A secret code uses the numbers 1 to 5. Every code word must meet these rules:\n• A code word has at least three numbers and no more than five.\n• Numbers may repeat unless a rule below says otherwise.\n• Every code word begins with 1.\n• 4 may not be the last number.\n• If 5 is the last number, the word must contain at least one 4.\n• If 2 is the second number, 2 must also be the last number.\n• The number 1 can appear only once.", "Which numbers may NOT be the only numbers used in a three-number code word?", ["1 and 2", "1, 2 and 4", "1, 2 and 5", "1 and 5", "1 and 3"], "1 and 5", "With only 1 and 5, the word must be 1 5 5, which ends in 5 without a 4. The others work: 1 2 2, 1 4 2, 1 5 2, 1 3 3."],
["L", "A secret code uses the numbers 1 to 5. Every code word must meet these rules:\n• A code word has at least three numbers and no more than five.\n• Numbers may repeat unless a rule below says otherwise.\n• Every code word begins with 1.\n• 4 may not be the last number.\n• If 5 is the last number, the word must contain at least one 4.\n• If 2 is the second number, 2 must also be the last number.\n• The number 1 can appear only once.", "How many different three-number code words can be made using only the numbers 1, 2 and 3?", ["2", "3", "4", "5", "6"], "3", "The word starts with 1 and 1 cannot repeat, so the options are 122, 123, 132 and 133. 123 breaks the rule about 2 in second place, leaving 3."],
["L", "A secret code uses the numbers 1 to 5. Every code word must meet these rules:\n• A code word has at least three numbers and no more than five.\n• Numbers may repeat unless a rule below says otherwise.\n• Every code word begins with 1.\n• 4 may not be the last number.\n• If 5 is the last number, the word must contain at least one 4.\n• If 2 is the second number, 2 must also be the last number.\n• The number 1 can appear only once.", "If a code word ends with the number 5, which of the following must be true?", ["The word must contain at least four numbers", "2 is not the second number", "3 is not the third number", "1 is the fourth number", "4 appears twice in the code word"], "2 is not the second number", "If 2 were second it would also have to be last, but the last number is 5. (1 4 5 is a valid three-number word, so it need not have four numbers.)"],
["L", "", "Real Madrid is first in the league and Real Betis is fifth, while Osasuna is right between them. If Barcelona has more points than Celta Vigo, and Celta Vigo is directly below Osasuna, who is second?", ["Barcelona", "Osasuna", "Real Madrid", "Celta Vigo", "Atletico Madrid"], "Barcelona", "Osasuna is 3rd and Celta Vigo 4th. Barcelona is above Celta Vigo, and 1st and 3rd are taken, so Barcelona is 2nd."],
["L", "", "Richard is a strange liar. He lies on six days of the week, but on the seventh day he always tells the truth. He made these statements on three successive days. Day 1: \"I lie on Monday and Tuesday.\" Day 2: \"Today, it's Thursday, Saturday, or Sunday.\" Day 3: \"I lie on Wednesday and Friday.\" On which day does Richard tell the truth?", ["Wednesday", "Friday", "Tuesday", "Monday", "Cannot say"], "Tuesday", "If all three were lies, the truth day would have to be both Mon/Tue and Wed/Fri, which is impossible. Testing each day as the true one, only Day 3 = Tuesday works: Day 1 is Sunday and Day 2 is Monday, so both of those statements are false, as they must be."],
["L", "A personnel director is scheduling interviews for eight people: James, Ken, Linda, Mercy, Nola, Oday, Peter and Queen. Each person has one interview, held Monday to Friday of the same week, under these rules:\n• At least one person is interviewed each day.\n• More than one interview is scheduled on exactly two of the days.\n• Oday is the only person interviewed on Wednesday.\n• Mercy and Nola must be interviewed exactly three days after Queen.\n• Peter must be interviewed no later in the week than Ken.", "Which of the following CANNOT be true?", ["Oday's interview is later in the week than Ken's interview", "Linda's interview will be later in the week than I's interview.", "Ken's interview is later in the week than Nola's interview", "Linda's interview is on the same day as Nola's interview.", "James's interview is on the same day as Ken's interview."], "Linda's interview will be later in the week than I's interview.", "LOW CONFIDENCE. 'I' is a leftover from the original puzzle, which used letters, so this option is chosen by elimination. Each of the other four can happen: e.g. Mon Queen, Peter · Tue Ken · Wed Oday · Thu Mercy, Nola, Linda · Fri James makes the first and fourth true."],
["L", "Betty Momoh, Martin Kolade, John Nnoli, Sydney Sanni and Ted Etim all work in the same department in KPMG. They hold the positions of Clerk, Typist, Manager, Accountant and Buyer, but not respectively.\nI. The Typist bandaged the Buyer's finger when he cut it using the former's nail file.\nII. While the Manager and the Buyer were on a business trip, the Accountant docked Ted Etim and Sydney Sanni half a day's pay for taking an afternoon off.\nIII. The Accountant is a fine bridge player and Martin Kolade admires his ability.\nIV. Ted Etim invited the Typist to lunch, but this invitation was not accepted.", "The Accountant is", ["Sydney Sanni", "Ted Etim", "Martin Kolade", "Betty Momoh", "John Nnoli"], "John Nnoli", "From II, Ted and Sydney are the Clerk and Typist; from IV, Ted is not the Typist, so Ted is the Clerk and Sydney the Typist. The Accountant is male (III) and not Martin, and the Buyer is male (I), so John is the Accountant, Martin the Buyer and Betty the Manager."],
["L", "Betty Momoh, Martin Kolade, John Nnoli, Sydney Sanni and Ted Etim all work in the same department in KPMG. They hold the positions of Clerk, Typist, Manager, Accountant and Buyer, but not respectively.\nI. The Typist bandaged the Buyer's finger when he cut it using the former's nail file.\nII. While the Manager and the Buyer were on a business trip, the Accountant docked Ted Etim and Sydney Sanni half a day's pay for taking an afternoon off.\nIII. The Accountant is a fine bridge player and Martin Kolade admires his ability.\nIV. Ted Etim invited the Typist to lunch, but this invitation was not accepted.", "The Manager is", ["Sydney Sanni", "Ted Etim", "Martin Kolade", "Betty Momoh", "John Nnoli"], "Betty Momoh", "From II, Ted and Sydney are the Clerk and Typist; from IV, Ted is not the Typist, so Ted is the Clerk and Sydney the Typist. The Accountant is male (III) and not Martin, and the Buyer is male (I), so John is the Accountant, Martin the Buyer and Betty the Manager."],
["L", "Betty Momoh, Martin Kolade, John Nnoli, Sydney Sanni and Ted Etim all work in the same department in KPMG. They hold the positions of Clerk, Typist, Manager, Accountant and Buyer, but not respectively.\nI. The Typist bandaged the Buyer's finger when he cut it using the former's nail file.\nII. While the Manager and the Buyer were on a business trip, the Accountant docked Ted Etim and Sydney Sanni half a day's pay for taking an afternoon off.\nIII. The Accountant is a fine bridge player and Martin Kolade admires his ability.\nIV. Ted Etim invited the Typist to lunch, but this invitation was not accepted.", "The Buyer is", ["Sydney Sanni", "Ted Etim", "Martin Kolade", "Betty Momoh", "John Nnoli"], "Martin Kolade", "From II, Ted and Sydney are the Clerk and Typist; from IV, Ted is not the Typist, so Ted is the Clerk and Sydney the Typist. The Accountant is male (III) and not Martin, and the Buyer is male (I), so John is the Accountant, Martin the Buyer and Betty the Manager."],
["L", "The letters A, B, C, D, E, F and G, not necessarily in that order, stand for seven consecutive integers from 1 to 10.\n• D is 3 less than A.\n• B is the middle term.\n• F is as much less than B as C is greater than D.\n• G is greater than F.", "A is as much greater than F as which letter is less than G?", ["B", "C", "D", "E", "F"], "D", "Working it out, the order from smallest to largest is E, F, D, B, C, A, G. A is 4 more than F, and D is 4 less than G. Reading note: the options were not readable in the photo, so letter options are used here."],
["L", "The letters A, B, C, D, E, F and G, not necessarily in that order, stand for seven consecutive integers from 1 to 10.\n• D is 3 less than A.\n• B is the middle term.\n• F is as much less than B as C is greater than D.\n• G is greater than F.", "An integer T is as much greater than C as C is greater than E. T can be written as A + E. What is D?", ["2", "3", "4", "5", "Cannot be determined"], "5", "Working it out, the order from smallest to largest is E, F, D, B, C, A, G. If E = x, then C = x + 4 and A = x + 5. T = 2C − E = x + 8 = A + E = 2x + 5, so x = 3 and D = x + 2 = 5."],
["L", "", "Which one of the five makes the best comparison? TRRTTRT is to 9449949 as TRTRRTRT is to ____", ["94944494", "94949449", "49499494", "94944949", "49499949"], "94944949", "T becomes 9 and R becomes 4, so TRTRRTRT becomes 94944949."],
["N", "", "If a company's revenue grows by 15% one year and then declines by 10% the next year, what is the overall percentage change in revenue over the two years?", ["5% increase", "1.5% increase", "3.5% increase", "2.5% increase"], "3.5% increase", "1.15 x 0.90 = 1.035, which is a 3.5% increase."],
["N", "", "A runner completes a 10 km race in 40 minutes. What is their average speed in km/h?", ["15 km/h", "12.5 km/h", "20 km/h", "17.5 km/h"], "15 km/h", "40 minutes = 2/3 hour. 10 / (2/3) = 15 km/h."],
["N", "", "A factory produces 500 units of a product per day. If the production capacity is increased by 25%, how many units will it produce per day?", ["600 units daily", "550 units", "675 units per day", "625 units"], "625 units", "500 x 1.25 = 625."],
["N", "", "A researcher is calculating the mean of a dataset. If the sum of all observations is 750 and there are 15 observations, what is the mean?", ["45", "50", "60", "55"], "50", "750 / 15 = 50."],
["N", "", "A survey of 1000 people revealed that 700 own a smartphone, 400 own a tablet, and 200 own neither. How many people own both a smartphone and a tablet?", ["300 people", "Exactly 400", "Just 100", "A total of 200"], "300 people", "800 own at least one device. 700 + 400 - 800 = 300 own both."],
["N", "", "If a number is increased by 20% and then decreased by 20%, what is the net percentage change?", ["4% increase", "No change", "2% decrease", "4% decrease"], "4% decrease", "1.2 x 0.8 = 0.96, a 4% decrease."],
["N", "", "A car travels the first 100 km of a journey at 50 km/h and the next 100 km at 75 km/h. Calculate the average speed for the entire 200 km journey.", ["Approximately 60 km/h", "A speed of 65 km/h", "Around 58.3 km/h", "Precisely 62.5 km/h"], "Approximately 60 km/h", "Time = 2 h + 1.33 h = 3.33 h. 200 / 3.33 = 60 km/h. (The simple average, 62.5, is the trap.)"],
["N", "", "In a class, 70% of students passed in Mathematics, 60% passed in Science, and 50% passed in both. What percentage of students failed in both subjects?", ["0.1", "0.4", "0.2", "0.3"], "0.2", "Passed at least one = 70 + 60 - 50 = 80%. Failed both = 20% (0.2)."],
["N", "", "A train travels from City A to City B at a speed of 60 km/h and returns from City B to City A at a speed of 80 km/h. What is the average speed for the entire journey?", ["68.57 km/h", "70 km/h", "75 km/h", "69.23 km/h"], "68.57 km/h", "Equal distances, so use the harmonic mean: 2 x 60 x 80 / 140 = 68.57 km/h."],
["N", "", "If the mean of a dataset is 50 and the standard deviation is 5, and each data point is multiplied by 3, what will be the new mean and standard deviation?", ["New mean 150, new SD 5", "Mean 50, SD 15", "Mean 50, SD 5", "Mean 150, SD 15"], "Mean 150, SD 15", "Multiplying by 3 multiplies both the mean and the standard deviation by 3."],
["N", "", "The average score of a class of 30 students on a test was 75. If the scores of 5 students who scored an average of 85 were removed, what would be the new average score of the remaining students?", ["73.75", "74.25", "72.5", "73"], "73", "Total = 30 x 75 = 2250. Remove 5 x 85 = 425, leaving 1825 over 25 students = 73. Reading note: in the photo the options read 73.75, 74.25, 73.75, 72.5, so 73 was not shown. It is added here so the correct value is selectable."],
["N", "", "A contractor estimates that a project will take 10 workers 15 days to complete. If the contractor hires 5 more workers, how many days will it take to complete the same project, assuming all workers work at the same rate?", ["Approximately 11 days", "Just under 12 days", "A little over 10 days", "Exactly 10 days"], "Exactly 10 days", "10 x 15 = 150 worker-days. 150 / 15 workers = 10 days. Reading note: the last option was cut off in the photo and is reconstructed."],
["N", "", "In a group of 100 students, 70 play basketball and 60 play soccer. If 40 students play both sports, how many play neither sport?", ["10", "30", "20", "40"], "10", "70 + 60 - 40 = 90 play at least one sport, so 10 play neither."],
["N", "", "A field is to be fenced. If the length of the field is increased by 10% and the width is decreased by 10%, what is the percentage change in the area of the field?", ["1% increase", "No change", "10% decrease", "1% decrease"], "1% decrease", "1.1 x 0.9 = 0.99, a 1% decrease. Reading note: the last option was cut off in the photo and is reconstructed."],
["N", "", "A stock price increased by 20% in January and then decreased by 15% in February. If the initial price was $100, what is the price at the end of February?", ["115", "117", "110", "119", "102"], "102", "100 x 1.20 = 120. 120 x 0.85 = 102. Reading note: options after D were cut off in the photo, and 102 is added."],
["N", "", "A car travels at 50 km/h for 2 hours and then at 70 km/h for 3 hours. What is the average speed for the entire journey?", ["Average speed 60 km/h", "64 km/h average", "The speed 66 km/h", "62 km/h total"], "62 km/h total", "Distance = 100 + 210 = 310 km over 5 h = 62 km/h."],
["N", "", "A market researcher finds that 80% of consumers recognize Brand A, 60% recognize Brand B, and 50% recognize both. What percentage of consumers recognize at least one of the brands?", ["Seventy percent", "Ninety percent", "Eighty percent"], "Ninety percent", "80 + 60 - 50 = 90%."],
["N", "", "A certain recipe requires 3 cups of flour for 12 servings. How many cups of flour are needed for 20 servings?", ["4.5 cups", "5.5 cups", "4 cups", "5 cups"], "5 cups", "3/12 = 0.25 cup per serving. 0.25 x 20 = 5 cups."],
["N", "", "A student's score on a test was 80. If the teacher decides to curve the scores by adding 5 points to each student's score, what is the new score for this student?", ["75", "80", "90", "85"], "85", "80 + 5 = 85. Reading note: the last option was cut off in the photo and is reconstructed."],
["N", "", "A dataset has a median of 75. If each value in the dataset is multiplied by 2, what will be the new median?", ["77", "152", "150", "75"], "150", "The median scales with the data: 75 x 2 = 150."],
["N", "", "A rectangle is 14 cm long and 10 cm wide. If the length is reduced by x cm and the width is increased by x cm so as to make it a square, by how many square cm does its area change?", ["4", "144", "12", "2", "None of the above"], "4", "14 − x = 10 + x gives x = 2, so the square is 12 × 12 = 144. The original area was 140, so it changes by 4."],
["N", "", "A motorcycle stunt rider at a fair rides around the vertical wall of a circular well at an average speed of 54 km/h for 5 minutes. If the radius of the well is 5 metres, what distance is travelled?", ["2.5 km", "3.5 km", "4.5 km", "5.5 km", "None of the above"], "4.5 km", "Distance = speed × time = 54 × 5/60 = 4.5 km. The radius is not needed."],
["N", "", "1 cm on a map corresponds to an actual distance of 40 km. If the distance on the map between Bombay and Calcutta is 37.5 cm, what is the actual distance between them?", ["375 km", "3,750 km", "1,500 km", "1,375 km", "None of the above"], "1,500 km", "37.5 × 40 = 1,500 km."],
["N", "", "A box contains 90 nuts each weighing 100 g and 100 bolts each weighing 150 g. If the full box weighs 35.5 kg, what does the empty box weigh?", ["10 kg", "10.5 kg", "11 kg", "11.5 kg", "None of the above"], "11.5 kg", "Nuts: 90 × 100 g = 9 kg. Bolts: 100 × 150 g = 15 kg. 35.5 − 24 = 11.5 kg. ('mts' in the original is a typo for nuts.)"],
["N", "", "If the radius of a circle is increased by 20%, by what percentage is its area increased?", ["44%", "120%", "144%", "40%", "None of the above"], "44%", "Area scales with the square of the radius: 1.2² = 1.44, a 44% increase."],
["N", "", "Tom, Dick and Harry went to lunch. Tom had $100, Dick had $60 and Harry had $40. They got a bill for $104 and decided to tip $16, sharing the total in the ratio of the money each carried. How much more did Tom pay than Harry?", ["$120", "$200", "$60", "$24", "$36"], "$36", "Total = $120, split 100 : 60 : 40 = 5 : 3 : 2. Tom pays $60 and Harry $24, a difference of $36. (The original sheet has a typo, $409 for Harry; $40 is the amount that makes the answer key work.)"],
["N", "", "Four concentric circles have radii x, 2x, 3x and 4x. Ring A is the region between the circles of radius x and 2x; ring B is the region between the circles of radius 3x and 4x. What is the ratio of the area of ring A to the area of ring B?", ["1 : 2", "1 : 4", "2 : 3", "3 : 7", "None of the above"], "3 : 7", "Ring A = π(4x² − x²) = 3πx². Ring B = π(16x² − 9x²) = 7πx². Ratio 3 : 7."],
["N", "", "If 3/p = 6 and 3/q = 15, then p − q = ?", ["1/3", "2/5", "3/10", "5/6", "None of the above"], "3/10", "p = 1/2 and q = 1/5, so p − q = 5/10 − 2/10 = 3/10."],
["N", "", "A father is three times as old as his son. After fifteen years the father will be twice as old as his son. What is the father's present age?", ["36", "42", "45", "48", "None of the above"], "45", "3s + 15 = 2(s + 15) gives s = 15, so the father is 45."],
["N", "", "(1/4)³ + (3/4)³ + 3(1/4)(3/4)(1/4 + 3/4) = ?", ["1/64", "27/64", "49/64", "0", "1"], "1", "This is a³ + b³ + 3ab(a + b) = (a + b)³, and 1/4 + 3/4 = 1, so the answer is 1."],
["N", "", "If the areas of two circles are in the ratio 169 : 196, what is the ratio of their radii?", ["10 : 11", "11 : 12", "12 : 13", "13 : 14", "None of the above"], "13 : 14", "Take square roots: √169 : √196 = 13 : 14."],
["N", "", "A regular hexagon is inscribed in a circle of radius r cm. What is the perimeter of the hexagon?", ["3r", "6r", "r", "9r"], "6r", "Each side of a regular hexagon inscribed in a circle equals the radius, so the perimeter is 6r."],
["N", "", "a and b are the lengths of the base and height of a right-angled triangle with hypotenuse h. If a and b are positive integers, which of the following cannot be the value of h²?", ["13", "23", "37"], "23", "h² = a² + b². 13 = 4 + 9 and 37 = 1 + 36, but 23 is not a sum of two perfect squares."],
["N", "", "Rs.432 is divided among three workers A, B and C so that 8 times A's share equals 12 times B's share, which equals 6 times C's share. How much did A get?", ["Rs.192", "Rs.133", "Rs.144", "Rs.128"], "Rs.144", "Let 8A = 12B = 6C = k. Then A + B + C = k/8 + k/12 + k/6 = 9k/24 = 432, so k = 1,152 and A = 144."],
["N", "", "Two workers A and B made a batch of identical parts. A worked for 2 hours and B for 5 hours, and together they did half the job. They then worked together for another 3 hours, after which 1/20 of the job was still left. How long would B take to do the whole job alone?", ["24 hours", "12 hours", "15 hours", "30 hours"], "15 hours", "2a + 5b = 1/2 and 3(a + b) = 1/2 − 1/20 = 9/20, so a + b = 3/20. Then 2(3/20 − b) + 5b = 1/2 gives b = 1/15: B alone takes 15 hours."],
["N", "", "Two cogged wheels, one with 32 cogs and the other with 54, work into each other. If the larger wheel turns 80 times in three quarters of a minute, how many times does the smaller wheel turn in 8 seconds?", ["48", "135", "24", "None of these"], "24", "The 54-cog wheel turns 80 × 8/45 times in 8 seconds. The smaller wheel turns 54/32 times as often: 80 × 8/45 × 54/32 = 24."],
["N", "", "The monthly incomes of A and B are in the ratio 4 : 5 and their expenses are in the ratio 5 : 6. If A saves Rs.25 a month and B saves Rs.50 a month, what are their incomes?", ["Rs.400 and Rs.500", "Rs.240 and Rs.300", "Rs.320 and Rs.400", "Rs.440 and Rs.550"], "Rs.400 and Rs.500", "Incomes 4x and 5x, expenses 5y and 6y. 4x − 5y = 25 and 5x − 6y = 50 give x = 100, so the incomes are 400 and 500."],
["N", "", "The ratio of milk to water in three samples is 2 : 1, 3 : 2 and 5 : 3. A mixture is made from equal quantities of all three samples. What is the ratio of milk to water in the mixture?", ["2 : 1", "5 : 1", "99 : 61", "227 : 133"], "227 : 133", "Milk = 2/3 + 3/5 + 5/8 = 227/120. Water = 1/3 + 2/5 + 3/8 = 133/120. Ratio 227 : 133."],
["N", "", "A group of workers can do a piece of work in 24 days. Because 7 of them were absent, it took 30 days. How many people actually worked on the job?", ["35", "30", "28", "42"], "28", "24n = 30(n − 7) gives n = 35, so 35 − 7 = 28 people worked."],
["N", "", "A, B and C play cricket. A's runs are to B's runs, and B's runs are to C's runs, as 3 : 2. Together they scored 342 runs. How many runs did A make?", ["162", "108", "72", "None of these"], "162", "A : B : C = 9 : 6 : 4, which is 19 parts. 342 ÷ 19 = 18, so A = 9 × 18 = 162."],
["N", "", "How many triangles can be formed by joining three of the vertices of an octagon?", ["326", "120", "56", "Cannot be determined"], "56", "Choose any 3 of the 8 vertices: 8C3 = 56."],
["N", "", "Each of the 4 subsidiaries of Salami Corporation has been granted a line of credit of N700,000, and each of the other 3 subsidiaries has been granted a line of credit of N112,000. What is the average line of credit granted to a subsidiary?", ["N1,568,000", "N448,000", "N406,000", "N313,600", "N116,000"], "N448,000", "(4 × 700,000 + 3 × 112,000) ÷ 7 = 3,136,000 ÷ 7 = N448,000."],
["N", "", "An elevator has a safe weight limit of 2,000 pounds. What is the greatest number of people who can safely ride at one time if half the riders average 180 pounds and the other half average 215 pounds?", ["7", "8", "9", "10", "11"], "10", "Each pair weighs 180 + 215 = 395 pounds. 5 pairs = 1,975 pounds is safe; 6 pairs = 2,370 is not. So 10 people."],
["N", "", "There are between 100 and 110 pens in a collection. Counted 3 at a time there are 2 left over; counted 4 at a time there is 1 left over. How many pens are there?", ["101", "103", "106", "107", "109"], "101", "Numbers in range that leave 1 when divided by 4: 101, 105, 109. Of these only 101 leaves 2 when divided by 3."],
["N", "", "One-fifth of the shoes produced by a factory are defective. Four-fifths of the defective shoes are rejected, and one-twentieth of the non-defective shoes are rejected by mistake. If all shoes not rejected are sold, what percent of the shoes sold are defective?", ["4%", "5%", "6.25%", "11%", "16%"], "5%", "Defective sold = 1/5 × 1/5 = 0.04. Good sold = 4/5 × 19/20 = 0.76. 0.04 ÷ 0.80 = 5%."],
["N", "", "A man is standing between a bank and a drug store. He is 60 feet from the bank, and the drug store is 100 feet from the bank. How many feet nearer is the man to the bank than the drug store is?", ["60 feet", "40 feet", "50 feet", "20 feet", "None of the above"], "40 feet", "100 − 60 = 40 feet."],
["N", "", "The value of Tade's office printer at the end of each year is four-fifths of its value at the start of that year. If its initial value is N5,000, what is its value after 3 years?", ["N4,750.25", "N4,000.00", "N2,560.00", "N2,000.00", "N640.00"], "N2,560.00", "5,000 × (4/5)³ = 5,000 × 64/125 = N2,560."],
["N", "", "On Friday, Chigozie withdrew 10% of the amount in her savings account, and on Wednesday she deposited N140. If there were no other transactions and the balance after Wednesday was 125% of the original amount, how much was originally in the account?", ["N125", "N175", "N750", "N500", "None of the above"], "None of the above", "0.9x + 140 = 1.25x gives 0.35x = 140, so x = N400, which is not listed."],
["N", "", "Data sufficiency. Point P (4, t) is equidistant from points Q and R. What is the value of t? (1) The coordinates of Q are (1, 1). (2) The coordinates of R are (5, 5).", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "You need both points. With Q(1,1) and R(5,5): 9 + (t − 1)² = 1 + (t − 5)², so t = 2."],
["N", "", "Data sufficiency. In a group of 18 people, one third are men. One person is chosen at random. What is the probability that the person is a man who is a graduate? (1) The probability that a person chosen at random is a graduate is 5/18. (2) The probability that a woman chosen at random is a graduate is 1/3.", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "(1) gives 5 graduates in all. (2) gives 4 of the 12 women. Together, 1 man is a graduate, so the probability is 1/18. Neither alone is enough."],
["N", "", "Data sufficiency. X is one of the numbers 1/3, 2/7 or 3/14. What is X? (1) 2.5 < 1/X < 3.7 (2) 2.8 < 1/X < 3.9", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "Statements (1) and (2) TOGETHER are NOT sufficient", "1/X is 3, 3.5 or 4.67. Both statements, alone or together, allow 3 and 3.5, so X is not fixed."],
["N", "", "M, N and O are consecutive integers. Which of the following is true?", ["M + N + O is always even", "M + N + O is always odd", "M + 2N + O is always even", "M + 2N + O is always odd", "None of these is true"], "M + 2N + O is always even", "(N − 1) + 2N + (N + 1) = 4N, always even. M + N + O = 3N, which can be odd or even."],
["N", "", "If m × n = p and p ≠ 0, where m, n and p are real numbers, which of the following must be true?", ["p is an integer", "m × p = n", "m ≠ 0", "n × p = m", "m ÷ n = p"], "m ≠ 0", "If m were 0, the product p would be 0. Nothing forces the others."],
["N", "", "If r, s and t are consecutive odd integers with r < s < t, which of the following must be true?", ["rs = t", "s + t = r + 2", "r + t = 2t − s", "r + t = 2s", "r + s = t + 2"], "r + t = 2s", "r = s − 2 and t = s + 2, so r + t = 2s."],
["N", "", "The ratio of the sum of the first 6 terms of a geometric progression to the sum of its first 3 terms is 9. What is the common ratio?", ["3", "1/3", "2", "9", "1/9"], "2", "S6 ÷ S3 = 1 + r³ = 9, so r³ = 8 and r = 2."],
["N", "", "A four-character password consists of one letter of the alphabet and three different digits from 0 to 9. The letter must be the second or third character. How many different passwords are possible?", ["5,040", "18,720", "26,000", "37,440", "52,000"], "37,440", "2 positions for the letter × 26 letters × 10 × 9 × 8 for the digits = 37,440."],
["N", "", "In how many different ways can the letters of the word STUDY be arranged?", ["116", "117", "118", "119", "120"], "120", "Five different letters: 5! = 120."],
["N", "", "Mr. Shah walks down the moving escalator of a tube station. If he walks down 26 steps, he takes 30 seconds to reach the bottom. If he walks down 34 steps, he takes only 18 seconds. Timing from the moment the top step begins to descend until he steps off at the bottom, how many steps high is the stairway?", ["46", "22", "47", "41", "50"], "46", "Let the escalator move e steps a second. 26 + 30e = 34 + 18e gives e = 2/3, so the height is 26 + 20 = 46 steps."],
["N", "", "Data sufficiency. Is the average (arithmetic mean) of a, b and c equal to 8? (1) Three times the sum of a, b and c is 72. (2) The sum of 2a, 2b and 2c is 48.", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "EACH statement ALONE is sufficient", "Each statement alone gives a + b + c = 24, so the mean is 8. (The screen showed the first option twice by mistake.)"],
["N", "", "Data sufficiency. Bob drives west from point A to point B, then due south from B to C. How far is he from where he started? (1) A is 24 miles from B. (2) B is 18 miles from C.", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "The route is a right angle, so you need both legs: √(24² + 18²) = 30 miles."],
["N", "", "A wizard named Nepo says: \"I am only three times my son's age. My father is 40 years more than twice my age. Together the three of us are a mere 1,240 years old.\" How old is Nepo?", ["400", "20", "360", "450", "220"], "360", "Son s, Nepo 3s, father 6s + 40. 10s + 40 = 1,240, so s = 120 and Nepo is 360."],
["N", "", "Data sufficiency. How many people are directors of both Company K and Company R? (1) There were 17 directors present at a joint meeting of the directors of K and R, and no director was absent. (2) Company K has 12 directors and Company R has 8.", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "(1) gives 17 different people; (2) gives 20 seats. Together, 20 − 17 = 3 people sit on both boards."],
["N", "", "Data sufficiency. Of the 66 people in an auditorium, at most 6 have their birthday in any one month. Does at least one person have a birthday in January? (1) More people have their birthday in February than in March. (2) Five people have their birthday in March.", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "EACH statement ALONE is sufficient", "With nobody in January, the other 11 months would each need exactly 6 people. Each statement shows some month has fewer than 6, so January must have at least one."],
["N", "", "A ball is drawn from a bag containing 8 blue balls and an equal number of red balls. What is the probability that it is red?", ["3/4", "1/4", "2/3", "1/2", "None of the above"], "1/2", "8 red out of 16 balls = 1/2."],
["N", "", "Andre has already saved 3/7 of the cost of a new car, and he will be able to save 2/5 of the remaining amount before the end of the summer. What fraction of the cost will he still need to save after the summer?", ["6/35", "8/35", "12/35", "23/35", "29/35"], "12/35", "Remaining 4/7; he saves 2/5 of it = 8/35. Saved in all: 15/35 + 8/35 = 23/35, so 12/35 is left."],
["N", "Table 1: Staff distribution at TONA Gas Company (TGC). Percentage of total staff in each function.", "What percentage of staff did not work in either Operations or Others in 2010?", ["46.50%", "48.50%", "52.50%", "54.50%", "57.50%"], "46.50%", "100 − 40.5 − 13.0 = 46.5%.", {"tbl": [["Function", "2010", "2011", "2012", "2013", "2014"], [["Marketing", "19.0", "20.0", "25.0", "30.0", "25.0"], ["Customer Service", "20.0", "16.0", "12.5", "21.5", "25.0"], ["Operations", "40.5", "38.0", "30.0", "25.0", "22.0"], ["Finance", "7.5", "8.0", "5.0", "6.0", "8.0"], ["Others", "13.0", "18.0", "27.5", "17.5", "20.0"], ["Total", "100", "100", "100", "100", "100"]]]}],
["N", "", "An airline recorded 65,000 passengers on the LOS–LHR route in 2003. If passengers on the route rose by 45% in 2004, how many travelled the route in 2004?", ["87,750", "35,750", "93,150", "94,250", "78,750"], "94,250", "65,000 × 1.45 = 94,250."],
["N", "", "Ikoyi's population is 68,000 and falling by 80 people a year. Lekki's population is 42,000 and rising by 120 a year. In how many years will both have the same population?", ["124", "160", "148", "130", "184"], "130", "The gap of 26,000 closes by 200 a year: 26,000 ÷ 200 = 130 years."],
["N", "Table 1: Staff distribution at TONA Gas Company (TGC). Percentage of total staff in each function.", "If TGC employed 1,500 staff in 2014, how many worked in Finance?", ["120", "122", "124", "126", "128"], "120", "8% of 1,500 = 120.", {"tbl": [["Function", "2010", "2011", "2012", "2013", "2014"], [["Marketing", "19.0", "20.0", "25.0", "30.0", "25.0"], ["Customer Service", "20.0", "16.0", "12.5", "21.5", "25.0"], ["Operations", "40.5", "38.0", "30.0", "25.0", "22.0"], ["Finance", "7.5", "8.0", "5.0", "6.0", "8.0"], ["Others", "13.0", "18.0", "27.5", "17.5", "20.0"], ["Total", "100", "100", "100", "100", "100"]]]}],
["N", "", "What is the reflex angle formed between the hands of a clock at 15:40?", ["210", "160", "150", "120", "310", "230"], "230", "At 3:40 the hour hand is at 110° and the minute hand at 240°, 130° apart. The reflex angle is 360 − 130 = 230°. Reading note: 230 was not among the options on screen, so it has been added."],
["N", "", "A garrison of 3,300 men has provisions for 32 days at 850 grams per head. After 7 days, reinforcements arrive, and the provisions will now last 8 days less than they would have, at 825 grams per head. How many more men can it feed?", ["1,400 men", "5,775 men", "105 men", "1,700 men", "5,950 men"], "1,700 men", "Food left = 3,300 × 25 × 850 g. It must now last 17 days at 825 g: 3,300 × 25 × 850 ÷ (17 × 825) = 5,000 men, so 1,700 more."],
["N", "Table 1: Staff distribution at TONA Gas Company (TGC). Percentage of total staff in each function.", "In which year did the percentage of staff in Customer Service show the highest percentage increase over the previous year?", ["2011", "2012", "2013", "2014", "Cannot say"], "2013", "12.5% to 21.5% in 2013 is a 72% rise. 2014 rose about 16%, and 2011 and 2012 fell.", {"tbl": [["Function", "2010", "2011", "2012", "2013", "2014"], [["Marketing", "19.0", "20.0", "25.0", "30.0", "25.0"], ["Customer Service", "20.0", "16.0", "12.5", "21.5", "25.0"], ["Operations", "40.5", "38.0", "30.0", "25.0", "22.0"], ["Finance", "7.5", "8.0", "5.0", "6.0", "8.0"], ["Others", "13.0", "18.0", "27.5", "17.5", "20.0"], ["Total", "100", "100", "100", "100", "100"]]]}],
["N", "", "A researcher computed the mean, median and standard deviation of a set of scores. If 5 were added to each score, which of these would change?", ["The mean only", "The median only", "The standard deviation only", "The mean and the median", "The mean and the standard deviation"], "The mean and the median", "Adding a constant shifts the mean and median by 5 but leaves the spread, and so the standard deviation, unchanged."],
["N", "", "If n = 3⁸ − 2⁸, which of the following is not a factor of n?", ["97", "65", "35", "13", "5"], "35", "3⁸ − 2⁸ = (81 − 16)(81 + 16) = 65 × 97 = 5 × 13 × 97. There is no factor of 7, so 35 is not a factor."],
["N", "", "At apartment complex Z, 30 percent of the residents are men over 18 and 40 percent are women over 18. If 24 children live in the complex, how many residents are there in total?", ["32", "80", "94", "112", "124"], "80", "Children are the other 30%. 24 ÷ 0.3 = 80."],
["N", "Table 1: Staff distribution at TONA Gas Company (TGC). Percentage of total staff in each function.", "In which year did Customer Service in TGC employ the largest number of people?", ["2011", "2012", "2013", "2014", "Cannot say"], "Cannot say", "The table gives percentages only. Without the total staff for each year you cannot compare numbers of people.", {"tbl": [["Function", "2010", "2011", "2012", "2013", "2014"], [["Marketing", "19.0", "20.0", "25.0", "30.0", "25.0"], ["Customer Service", "20.0", "16.0", "12.5", "21.5", "25.0"], ["Operations", "40.5", "38.0", "30.0", "25.0", "22.0"], ["Finance", "7.5", "8.0", "5.0", "6.0", "8.0"], ["Others", "13.0", "18.0", "27.5", "17.5", "20.0"], ["Total", "100", "100", "100", "100", "100"]]]}],
["N", "", "What is the acute angle between the hands of a clock at 14:00?", ["60", "160", "150", "120", "310"], "60", "At 2:00 the hands are 2 × 30° = 60° apart."],
["N", "Table 1: Staff distribution at TONA Gas Company (TGC). Percentage of total staff in each function.", "If 1,450 staff were employed by TGC in 2011, how many worked in Marketing?", ["145", "189", "200", "290", "Cannot say"], "290", "20% of 1,450 = 290.", {"tbl": [["Function", "2010", "2011", "2012", "2013", "2014"], [["Marketing", "19.0", "20.0", "25.0", "30.0", "25.0"], ["Customer Service", "20.0", "16.0", "12.5", "21.5", "25.0"], ["Operations", "40.5", "38.0", "30.0", "25.0", "22.0"], ["Finance", "7.5", "8.0", "5.0", "6.0", "8.0"], ["Others", "13.0", "18.0", "27.5", "17.5", "20.0"], ["Total", "100", "100", "100", "100", "100"]]]}],
["N", "", "An electronics store normally sells all its merchandise at a 10 to 30 percent discount from the suggested retail price. During a sale it takes an additional 20 percent off the discounted price. What is the lowest possible price for an item with a suggested retail price of $260?", ["$130.00", "$145.60", "$163.80", "$182.00", "$210.00"], "$145.60", "Lowest = biggest discounts: 260 × 0.70 × 0.80 = $145.60."],
["N", "Table 1: Mileage chart, distance in miles. Read the distance where the two towns' row and column meet.", "During one day a sales representative travels from Drake to Eastham, then on to Fairfield, and finally back to Drake. How many miles does she cover?", ["128", "137", "141", "166", "172"], "137", "67 + 37 + 33 = 137 miles.", {"tbl": [["", "Amber Ford", "Black Bay", "Clay Brook", "Drake", "Eastham", "Fairfield", "Gregstead"], [["Black Bay", "486", "", "", "", "", "", ""], ["Clay Brook", "142", "370", "", "", "", "", ""], ["Drake", "308", "208", "210", "", "", "", ""], ["Eastham", "372", "152", "276", "67", "", "", ""], ["Fairfield", "340", "178", "240", "33", "37", "", ""], ["Gregstead", "530", "118", "415", "224", "158", "192", ""], ["Hamilton", "301", "229", "207", "24", "78", "52", "236"]]]}],
["N", "", "If 75 percent of all Americans own an automobile, 15 percent own a bicycle and 20 percent own neither, what percent own both?", ["0%", "1.33%", "3.75%", "5%", "10%"], "10%", "80% own at least one. 75 + 15 − 80 = 10%."],
["N", "Table 1: Mileage chart, distance in miles. Read the distance where the two towns' row and column meet.", "How many miles would a salesperson travel on a journey from Drake to Gregstead and back?", ["224", "328", "340", "448", "468"], "448", "224 each way × 2 = 448.", {"tbl": [["", "Amber Ford", "Black Bay", "Clay Brook", "Drake", "Eastham", "Fairfield", "Gregstead"], [["Black Bay", "486", "", "", "", "", "", ""], ["Clay Brook", "142", "370", "", "", "", "", ""], ["Drake", "308", "208", "210", "", "", "", ""], ["Eastham", "372", "152", "276", "67", "", "", ""], ["Fairfield", "340", "178", "240", "33", "37", "", ""], ["Gregstead", "530", "118", "415", "224", "158", "192", ""], ["Hamilton", "301", "229", "207", "24", "78", "52", "236"]]]}],
["N", "Table 1: Mileage chart, distance in miles. Read the distance where the two towns' row and column meet.", "Travelling at an average speed of 54 miles per hour, about how long would it take to travel from Hamilton to Black Bay?", ["2hrs 14mins", "2hrs 34mins", "3hrs 54mins", "4hrs 14mins", "4hrs 24mins"], "4hrs 14mins", "229 ÷ 54 = 4.24 hours, about 4 hours 14 minutes.", {"tbl": [["", "Amber Ford", "Black Bay", "Clay Brook", "Drake", "Eastham", "Fairfield", "Gregstead"], [["Black Bay", "486", "", "", "", "", "", ""], ["Clay Brook", "142", "370", "", "", "", "", ""], ["Drake", "308", "208", "210", "", "", "", ""], ["Eastham", "372", "152", "276", "67", "", "", ""], ["Fairfield", "340", "178", "240", "33", "37", "", ""], ["Gregstead", "530", "118", "415", "224", "158", "192", ""], ["Hamilton", "301", "229", "207", "24", "78", "52", "236"]]]}],
["N", "Table 1: Mileage chart, distance in miles. Read the distance where the two towns' row and column meet.", "At an average petrol consumption of 8 miles per litre, how many litres of petrol are needed to travel between Amber Ford and Clay Brook?", ["17.25", "17.5", "17.75", "18", "18.25"], "17.75", "142 ÷ 8 = 17.75 litres.", {"tbl": [["", "Amber Ford", "Black Bay", "Clay Brook", "Drake", "Eastham", "Fairfield", "Gregstead"], [["Black Bay", "486", "", "", "", "", "", ""], ["Clay Brook", "142", "370", "", "", "", "", ""], ["Drake", "308", "208", "210", "", "", "", ""], ["Eastham", "372", "152", "276", "67", "", "", ""], ["Fairfield", "340", "178", "240", "33", "37", "", ""], ["Gregstead", "530", "118", "415", "224", "158", "192", ""], ["Hamilton", "301", "229", "207", "24", "78", "52", "236"]]]}],

["N", "", "If a printing press can print 11 complete pages in 30 seconds, how many complete pages can it print in 155 seconds?", ["56", "55", "37", "54", "57"], "56", "11 × 155/30 = 56.8, so 56 complete pages."],
["N", "", "The average age of the 10 members of a committee is the same as it was 4 years ago, because an old member has been replaced by a young one. How much younger is the new member?", ["40", "23", "42", "49", "56"], "40", "In 4 years the ten ages would have added 40 years in total. For the average to stay the same, the new member must be 40 years younger than the one replaced."],
["N", "", "Which statement is true? A = (471 × 64,308) ÷ 20 and B = (23,073 × 45,798) ÷ (−7,497)", ["A is greater than B", "B is greater than A", "A and B are equal", "Cannot tell", "None of the answers"], "A is greater than B", "No arithmetic needed: A is positive and B is negative."],
["N", "", "A man ate 100 bananas in five days, each day eating 6 more than the day before. How many did he eat on the first day?", ["4", "7", "9", "8", "10"], "8", "a + (a+6) + (a+12) + (a+18) + (a+24) = 5a + 60 = 100, so a = 8."],
["N", "", "Data sufficiency. What is the perimeter of isosceles triangle MNP? (1) MN = 16 (2) NP = 20", ["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient", "Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient", "BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient", "EACH statement ALONE is sufficient", "Statements (1) and (2) TOGETHER are NOT sufficient"], "Statements (1) and (2) TOGETHER are NOT sufficient", "Even together, the third side could be 16 or 20, so the perimeter could be 52 or 56."],
["N", "", "A border of uniform width is placed around a rectangular photograph that measures 8 inches by 10 inches. If the area of the border is 144 square inches, what is the width of the border in inches?", ["3", "4", "6", "8", "9"], "3", "(8 + 2x)(10 + 2x) − 80 = 144 gives x² + 9x − 36 = 0, so x = 3."],
["N", "", "In the first week of the year, Nancy saved $1. In each of the next 51 weeks, she saved $1 more than the week before. What was the total amount she saved over the 52 weeks?", ["$1,326", "$1,352", "$1,378", "$2,652", "$2,756"], "$1,378", "1 + 2 + … + 52 = 52 × 53 ÷ 2 = 1,378."],
["N", "", "If a = −0.3, which of the following is true?", ["a < a² < a³", "a < a³ < a²", "a² < a < a³", "a² < a³ < a", "a³ < a < a²"], "a < a³ < a²", "a = −0.3, a³ = −0.027 and a² = 0.09."],
["N", "", "Over the course of a soccer season, 30 percent of the players on a team scored goals. What is the ratio of players who scored goals to those who did not?", ["3 to 10", "1 to 3", "3 to 7", "1 to 1", "3 to 1"], "3 to 7", "30% scored and 70% did not: 30 : 70 = 3 : 7."],
["N", "", "If the average (arithmetic mean) and the median of the numbers 3, 5, 9, 13 and y are equal, what is the value of y?", ["7", "8", "10", "15", "17"], "15", "If y ≥ 9 the median is 9, so (30 + y) ÷ 5 = 9 and y = 15."],
["N", "", "What percent of 112 is 14?", ["0.125%", "8%", "12.5%", "125%", "800%"], "12.5%", "14 ÷ 112 = 0.125 = 12.5%."],
["N", "", "200² − 2(200)(199) + 199² = ?", ["−79,201", "−200", "1", "200", "79,999"], "1", "This is a² − 2ab + b² = (a − b)² = (200 − 199)² = 1. (On screen the powers appeared as '2002 - 2200199 + 1992'.)"],
["N", "", "Richard is 6 years older than David, and David is 8 years older than Scott. In 8 years Richard will be twice as old as Scott. How old was David 4 years ago?", ["8", "10", "12", "14", "16"], "10", "Richard = Scott + 14. Scott + 22 = 2(Scott + 8) gives Scott = 6, so David is 14 now and was 10 four years ago."],
["N", "", "Chris's convertible gets gas mileage 40% greater than Stan's SUV. Harry's hatchback gets gas mileage 15% greater than Chris's convertible. Harry's hatchback gets mileage that is what percent greater than Stan's SUV?", ["25%", "46%", "55%", "61%"], "61%", "1.40 × 1.15 = 1.61, so 61% greater. Reading note: the fifth option was cut off in the photo."],
["N", "", "A store sells a six-pack of soda for $2.70. If this is a saving of 10 percent on the individual price of the cans, what is the price of a single can?", ["0.35", "0.40", "0.45", "0.50", "0.55"], "0.50", "2.70 is 90% of six cans, so six cans cost 3.00 and one costs 0.50."],
["N", "", "If x is 1 more than the product of 3 and z, and y is 1 less than the product of 2 and z, then 2x is how much greater than 3y when z is 4?", ["1", "2", "3", "5", "6"], "5", "x = 13 and y = 7, so 2x − 3y = 26 − 21 = 5."],
["N", "", "In a survey, 60% of respondents preferred coffee, 40% preferred tea and 25% preferred both. What percentage preferred neither coffee nor tea?", ["0.2", "0.05", "0.1", "0.15", "0.25"], "0.25", "At least one = 60 + 40 − 25 = 75%, so 25% (0.25) preferred neither. Reading note: 0.25 was not on screen, where the closest option was 0.2, so it has been added."],
["N", "", "A sum of money is invested at simple interest. It amounts to N1,200 in 3 years and N1,500 in 5 years. What is the principal?", ["N1,100", "N900", "N800", "N1,000", "N750"], "N750", "Two extra years add N300, so interest is N150 a year. Principal = 1,200 − 3 × 150 = N750. Reading note: N750 was not on screen, so it has been added. (If the question meant 2 years, the answer would be N1,000.)"],
["N", "", "A population of 10,000 bacteria doubles every hour. If the count is taken at 9:00 AM, what will the approximate population be at 2:00 PM the same day?", ["320000", "150000", "250000", "200000"], "320000", "5 doublings: 10,000 × 2⁵ = 320,000."],
["N", "", "A tank can be filled by pipe A in 4 hours and by pipe B in 6 hours. If both pipes are opened together, what fraction of the tank will be filled in 1 hour?", ["1/10", "1/5", "1/2", "5/12"], "5/12", "1/4 + 1/6 = 5/12. Reading note: on screen the options had been turned into numbers like 46154 by a spreadsheet; these are the fractions they stand for."],
["N", "", "A company's profit margin increased from 12% to 15% in a year. If revenue stayed constant at N1,000,000, what is the absolute increase in profit?", ["N12,000", "N3,000", "N30,000", "N15,000"], "N30,000", "3% of N1,000,000 = N30,000."],
["N", "", "A company's revenue rose 12% from Q1 to Q2, fell 15% in Q3 and rose 10% in Q4. If Q1 revenue was N500,000, what was the approximate revenue in Q4?", ["Five hundred fifteen thousand dollars", "Five hundred six thousand", "Five hundred twenty-two thousand five hundred", "Four hundred eighty-three thousand"], "Five hundred twenty-two thousand five hundred", "500,000 × 1.12 × 0.85 × 1.10 = 523,600, closest to 522,500."],
["N", "", "A dataset of test scores has a mean of 75 and a median of 78. If 10 is subtracted from each score, how do the new mean and median compare with the original values?", ["The mean will decrease by 10, and the median will remain unchanged.", "Both the mean and the median will increase by 10.", "The mean will remain unchanged, and the median will decrease by 10.", "Both the mean and the median will decrease by 10."], "Both the mean and the median will decrease by 10.", "Subtracting a constant shifts every score, so the mean and median both drop by 10."],
["N", "", "A rectangular garden has a length twice its width. If the perimeter is 72 metres, what is its area?", ["192 m²", "384 m²", "768 m²", "256 m²", "288 m²"], "288 m²", "6w = 72, so w = 12 and length = 24. Area = 288 m². Reading note: 288 was not on screen, so it has been added."],
["G", "", "All but one of the below countries is not bound by the European Union Treaties?", ["Denmark", "Luxembourg", "Cyprus", "Germany", "Slovakia"], "Denmark", "LOW CONFIDENCE (the question is badly worded; all five are EU members). Denmark is the one with formal opt-outs from parts of the EU treaties (euro, defence, justice and home affairs), so it is the intended odd one out."],
["G", "", "Which of the following is a specialised agency of ECOWAS?", ["West African Monetary Institute", "Community Court of Justice", "ECOWAS Bank for Investment and Development", "ECOWAS Commission", "West African Health Organisation"], "West African Health Organisation", "The West African Health Organisation (WAHO) is the classic ECOWAS specialised agency. The Commission and Court are institutions, and EBID is the bank. The monetary institute is arguable, so check your course notes."],
["G", "", "The supreme organ of the African Union responsible for the determining and monitoring the implementation of policies is called ____.", ["The Executive Council", "The Peace and Security Council", "The Assembly of the Union", "African Union Commission", "The Pan-African Parliament"], "The Assembly of the Union", "The Assembly of Heads of State and Government is the AU's supreme organ."],
["G", "", "Which of the following is a not an organ of the United Nations", ["The Executive Council", "The International Court of Justice", "The Economic and Social Council", "The UN Secretariat", "The Trusteeship Council"], "The Executive Council", "The six principal UN organs are the General Assembly, Security Council, ECOSOC, Trusteeship Council, ICJ and Secretariat. The Executive Council is an African Union organ."],
["G", "", "Which organization(s) suggested alternative trade alignments due to U.S. tariff pressures?", ["OECD", "WTO", "COMESA", "UNCTAD", "None of the above"], "COMESA", "COMESA proposed seeking alternative trade agreements (EU, China, Japan, India, Gulf states) and stronger intra-African trade in response to the US tariffs."],
["G", "", "Which global power was described as an \"electrostate\" due to mastery of the electric tech stack?", ["Japan", "Japan and South Korea", "South Korea", "Finland", "China"], "China", "'Electrostate' is the term used for China's lead in batteries, solar, EVs and grid technology."],
["G", "", "What is the full meaning of IBRD?", ["Independent Body of Risk Devolution", "Independent Body for Risk Devolution", "International Bank for Reconstruction & Development", "International Bank of Reconstruction & Development", "None of the Above"], "International Bank for Reconstruction & Development", "IBRD = International Bank for Reconstruction and Development (World Bank). The correct word is 'for', not 'of'."],
["G", "", "Which two tech giants faced jury verdicts that could reshape Section 230 protections?", ["Apple & Amazon", "Netflix & Tesla", "Meta & Google", "Tesla & Meta", "IBM & Intel"], "Meta & Google", "In March 2026 juries in Los Angeles and New Mexico found Meta and Google liable in child-safety cases, which could narrow Section 230 immunity."],
["G", "", "Which African country became a key node in global EV battery supply chains due to rising Chinese industrial investment by 2026?", ["Morocco", "South Africa", "Egypt", "Zambia", "Nigeria"], "Morocco", "Morocco hosts large Chinese-backed battery projects (for example Gotion's gigafactory and cathode plants)."],
["G", "", "Which new material(s) breakthrough could supercharge 6G technology?", ["Graphene Foam", "Carbon Nanotube Coating", "Liquid Metal Chips", "Quantum Fibre Mesh", "Graphene Foam, Carbon Nanotube Coating & Liquid Metal Chips"], "Carbon Nanotube Coating", "Medium confidence. 'Carbon nanotube coating could supercharge 6G' is the 2026 headline, from an ultrathin coating that absorbs terahertz interference. The other materials were not tied to that claim. In the photo option E read 'A, B, & C', rewritten here because options are numbered, not lettered."],
["G", "", "What type of sustainable train completed oscillation trials in India?", ["Solar", "Electric", "Hybrid", "Locomotive", "Hydrogen"], "Hydrogen", "India's first hydrogen-powered trainset completed its RDSO oscillation trial in 2026."],
["G", "", "Which region's conflict significantly escalated global tensions in March 2026?", ["Europe", "Middle East", "Africa", "Asia", "West Africa"], "Middle East", "The Middle East conflict is the one repeatedly cited in 2026 as clouding the global outlook."],
["G", "", "According to IMF projections, Nigeria's economy is expected to grow by what rate in 2026?", ["0.025", "0.03", "0.062", "0.0172", "0.044"], "0.044", "The IMF's January 2026 outlook put Nigeria's 2026 growth at 4.4% (0.044). Later updates cut it to about 4.1%, so the question matches the January figure."],
["G", "", "Which major waterways' disruption in 2026 threatened global agri-food systems and energy markets?", ["Suez Canal", "Panama Canal", "Bosphorus Strait", "Strait of Hormuz"], "Strait of Hormuz", "Disruption around the Strait of Hormuz threatened oil, gas and fertiliser flows."],
["G", "", "What is the full meaning of GATT?", ["Great-Britain Associate for Trade and Taxation", "Grecian Associate for Trading Tariffs", "General Agreement on Trade and Tariffs", "General Agreement on Tariffs and Trade", "Great-Britain Association for Traders and Taxpayers"], "General Agreement on Tariffs and Trade", "GATT = General Agreement on Tariffs and Trade (the WTO's predecessor)."],
["G", "", "In 2026 tech trends, which global theme drives the need for improved governance due to rapid AI expansion?", ["Miniaturization", "AI Governance", "Open-Source Hardware", "3D Bio-Manufacturing"], "AI Governance", "The theme is AI governance."],
["G", "", "Which retired AI model was granted autonomy to publish its own newsletter, illustrating emerging questions in AI agency, rights, and governance?", ["GPT-4", "Gemini Ultra", "Llama-3", "Claude 3 Opus"], "Claude 3 Opus", "Claude 3 Opus, from Anthropic, is the retired model associated with this."],
["G", "", "Which of the following is not an operational priority of the African Development Bank?", ["Infrastructure development", "Regional economic integration", "Private sector development", "Governance and accountability", "Economic and agricultural sustainability"], "Economic and agricultural sustainability", "AfDB's five operational priorities (2013 strategy) are infrastructure, regional integration, private sector development, governance and accountability, and skills and technology. 'Economic and agricultural sustainability' is not one of them."],
["G", "", "What does IDA stand for?", ["Immunization Drug Agency", "International Development Agency", "Immuno-Deficiency Agency", "International Development Association", "Independent Devolution Association"], "International Development Association", "IDA = International Development Association (the World Bank's arm for the poorest countries)."],
["G", "", "The African Union is divided into ____ geographical regions?", ["6", "10", "11", "5", "4"], "5", "The AU groups members into five regions: North, West, Central, East and Southern Africa. The diaspora is sometimes called the 'sixth region'."],

["G", "", "The following countries were part of the former USSR (Soviet Union) except ___", ["Armenia", "Georgia", "Belarus", "Romania", "none of the above"], "Romania", "Romania was a Soviet-aligned state but never part of the USSR."],
["G", "", "The capital of the Central African Republic is ___", ["Maputo", "Porto-Novo", "Dhaka", "Luanda", "Bangui"], "Bangui", "Maputo is Mozambique's capital, Porto-Novo Benin's, Dhaka Bangladesh's and Luanda Angola's."],
["G", "", "The 8th National Assembly of Nigeria was inaugurated on ____", ["9th May 2016", "10th June 2015", "19th May 2015", "9th June 2015", "none of the above"], "9th June 2015", "It was inaugurated on 9 June 2015, with Bukola Saraki as Senate President."],
["G", "", "Nigeria's National Assembly is made up of ____", ["361 members of the House of Representatives and 103 senators", "360 members of the House of Representatives and 109 senators", "366 members of the House of Representatives and 100 senators", "101 senators and 369 members of the House of Representatives", "none of the above"], "360 members of the House of Representatives and 109 senators", "Three senators for each of the 36 states plus one for the FCT gives 109; the House has 360 seats."],
["G", "", "The act to abolish the African slave trade came into effect on ___", ["10th June 1908", "1st January 1808", "1st March 1808", "1st February 1808", "10th January 1808"], "1st January 1808", "The US Act Prohibiting Importation of Slaves took effect on 1 January 1808. (Britain's Slave Trade Act took effect on 1 May 1807, which is not offered.)"],

["G", "", "The historical partitioning of Africa took place at the ___ in 1884–85.", ["German Conference in Berlin", "Berlin Conference in Germany", "Ottoman Conference in Stuttgart", "Munich Conference in Paris", "Municipal Conference in Armenia"], "Berlin Conference in Germany", "The Berlin Conference ran from November 1884 to February 1885."],
["G", "", "The League of Nations, a precursor to the United Nations, was formed on ___", ["10th January 1920", "10th November 1920", "10th March 1920", "10th January 1921", "10th January 1919"], "10th January 1920", "It came into being when the Treaty of Versailles took effect on 10 January 1920."],

["G", "", "The World Bank consists of which of the following organisations? I. International Bank for Reconstruction and Development II. International Finance Corporation III. International Development Association IV. International Centre for Settlement of Investment Disputes V. Multilateral Investment Guarantee Agency", ["I only", "I and III", "I, II, III and V", "All of the answers", "I and II"], "I and III", "'The World Bank' strictly means IBRD and IDA. All five together form the World Bank Group (see the separate question that asks about the Group)."],

["G", "", "Which of the following is a fund of the African Development Bank Group aimed at achieving its purposes of inclusive growth and the transition to green growth?", ["The African Development Fund", "Nigeria Trust Fund", "The Arab Oil Fund", "The Special Relief Fund", "All of the answers"], "All of the answers", "LOW CONFIDENCE. The African Development Fund and the Nigeria Trust Fund are part of the AfDB Group, and the Bank also administers the Arab Oil Fund and the Special Relief Fund, so 'All of the answers' fits best. If your notes say the African Development Fund alone, go with your notes."],
["G", "", "When was the World Health Organization founded?", ["7 April 1948", "1 January 1995", "12 December 1950", "12 January 1945", "25 August 1994"], "7 April 1948", "Its constitution took effect on 7 April 1948, now marked as World Health Day."],
["G", "", "Which of the following unions have fewer than 60 member states?", ["African Union (AU)", "European Union (EU)", "Association of Southeast Asian Nations (ASEAN)", "None of the above", "All three of the above"], "All three of the above", "The AU has 55 members, the EU 27 and ASEAN 11 (Timor-Leste joined in 2025). On screen this option read 'A, B, & C'."],
["G", "", "The World Bank Group consists of which of the following organisations? I. International Bank for Reconstruction and Development II. International Finance Corporation III. International Development Association IV. International Centre for Settlement of Investment Disputes V. Multilateral Investment Guarantee Agency", ["I only", "All of the answers", "I and III", "I, II, III and V", "I and II"], "All of the answers", "The World Bank Group is all five institutions. 'The World Bank' alone means just IBRD and IDA."],
["G", "", "Which of the following is not a permanent member of the United Nations Security Council?", ["Russia", "China", "France", "Italy", "United Kingdom"], "Italy", "The five permanent members are China, France, Russia, the UK and the US."],
["G", "", "The international financial institution whose primary purpose is to ensure the stability of the international monetary system and to monitor the world's currencies is", ["The World Bank", "International Securities and Exchange Bank", "The International Monetary Fund", "The World Bank Group", "The International Centre for Settlement of Disputes"], "The International Monetary Fund", "That is the IMF's core mandate; the World Bank funds development."],

["G", "", "The economic system characterised by private ownership of the means of production, in which decisions about production and investment are made by private owners, is best known as", ["Circular economy", "Socialism", "Mixed economy", "Capitalism", "Inflationary"], "Capitalism", "Private ownership and private decisions define capitalism."],

const ESSSTOP=new Set('the a an and or but of to in on for with at by from as is are was were be been being it its this that these those there their they them he she his her we our you your i my me not no so if then than too very can could should would will may might must do does did done have has had having into about over under between among across per also such more most less least much many any each other another some which who whom whose what when where why how while during after before because since until upon within without through against'.split(' '));

 else{const n=S.length,a=Math.min(3,Math.max(1,Math.floor(n*.2))),z=Math.min(2,Math.max(1,Math.floor(n*.12)));intro=S.slice(0,a).join(' ');concl=S.slice(n-z).join(' ');const mid=S.slice(a,n-z),k=Math.max(2,Math.round(mid.length/5)),sz=Math.ceil(mid.length/k);body=[];for(let i=0;i<mid.length;i+=sz)body.push(mid.slice(i,i+sz).join(' '))}

  if(c>=e.min)n.push(`${c.toLocaleString()} ${u}: the minimum of ${e.min.toLocaleString()} is met.`);else{n.push(`${c.toLocaleString()} ${u}: ${(e.min-c).toLocaleString()} short of the minimum.`);f.push(`Add ${(e.min-c).toLocaleString()} more ${u}, most usefully a second example in a body paragraph.`)}

  st.thesis=ESSX.thesis.test(last2);n.push(st.thesis?'Step 3 (thesis): a clear position appears at the end of the introduction.':'Step 3 (thesis): no clear position at the end of the introduction.');if(!st.thesis)f.push('End the introduction with one sentence that states your answer and names the points you will cover, e.g. "This essay argues that ... because ...".');

 // 3 body

 {const n=[],f=[];let tot=0;

   const miss=[!st.topic&&'topic sentence',!st.reason&&'a reason or example',!st.another&&'a second reason or example',!st.summary&&'a closing summary sentence'].filter(Boolean);
   n.push(`Body paragraph ${i+1}: ${miss.length?'missing '+miss.join(', '):'all four steps found'} (${s.length} sentences).`);

  let s=body.length?tot/body.length:0;if(body.length<2){s*=.6;n.push('Fewer than two body paragraphs.');f.push('Use at least two body paragraphs, each making one separate point.')}

 // 4 conclusion
 {const n=[],f=[],cS=ESSS(concl),st={};st.signal=ESSX.concl.test(cS[0]||'')||ESSX.concl.test(concl);st.restate=ESSW(concl).length>=15&&(ov(concl,pk)>=.2||ov(concl,ESSC(intro))>=.2);st.len=cS.length>=2&&ESSW(concl).length>=25;st.noNew=(concl.match(/\d/g)||[]).length<=1&&!/for (example|instance)/i.test(concl);

function gBart(){const me=++alive;cleanup();start('game');pip(true);const N=10,MAX=24,PTS=5,OPT=12;let n=0,bank=0,pumps=0,burst=R(1,MAX),log=[],lock=false;

 const nextB=()=>{n++;if(n>=N)return fin();pumps=0;burst=R(1,MAX);lock=false;$('#be').setAttribute('fill','var(--ac)');paint()};
 const pump=()=>{if(me!==alive||lock)return;pumps++;if(pumps>=burst){lock=true;log.push({p:pumps,pop:true});$('#be').setAttribute('fill','var(--bad)');$('#bl').style.transform='scale(1.5)';say('Popped');paint('Popped! This balloon scores 0.');setTimeout(()=>{if(me===alive)nextB()},1100)}else paint()};

  gRes('Balloon risk',[['Points banked',bank],['Popped',pops+' of '+N],['Avg pumps (unpopped)',safe.length?adj.toFixed(1):'–'],['Best balance',OPT+' pumps']],`${note}<p class="mut sm">Each balloon bursts at a random pump from 1 to ${MAX}, so expected points peak at about ${OPT} pumps. The average is taken over balloons you banked, the standard way this task is measured. There is no single right score; employers look for a deliberate, consistent approach.</p>`,

 app.innerHTML=`<section class="stack"><div class="row sp"><h1 style="margin:0">Dashboard</h1><div class="seg" id="flt" role="group" aria-label="Company filter">${[['all','All'],['shell','Shell'],['bae','BAE'],['kpmg','KPMG'],['deloitte','Deloitte'],['bp','BP']].map(([k,l])=>`<button data-f="${k}" class="${flt===k?'on':''}">${l}</button>`).join('')}</div></div><div class="seg" id="tabs" role="group" aria-label="Sections">${TABS.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="pane" class="stack"></div><p id="tip" class="tip" role="status">Tap or hover a point or bar for details.</p></section>`;
